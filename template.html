<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="600">
<meta name="theme-color" content="#111114">
<title>채널 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f5f4f1;--card:#fff;--ink:#16161a;--sub:#6d6d75;--line:#e7e5e0;--soft:#efeee9;--up:#e0392b;--down:#2b6de0;--shorts:#ff3d55;--long:#3a3a42;--ok:#1f9d6b;--accent:#16161a;--accent-ink:#fff;--tip:#fff7d6;--tip-ink:#5b4a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--card:#19191e;--ink:#f1f1f4;--sub:#9b9ba4;--line:#2a2a31;--soft:#222228;--long:#c7c7cf;--accent:#f1f1f4;--accent-ink:#111114;--tip:#2a2615;--tip-ink:#f3dd8a}}
:root[data-theme="dark"]{--bg:#0f0f12;--card:#19191e;--ink:#f1f1f4;--sub:#9b9ba4;--line:#2a2a31;--soft:#222228;--long:#c7c7cf;--accent:#f1f1f4;--accent-ink:#111114;--tip:#2a2615;--tip-ink:#f3dd8a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;height:58px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.upd{color:var(--sub);font-size:12px;margin-left:auto;text-align:right;white-space:nowrap}
nav.tabs{display:flex;gap:2px}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;color:var(--sub);font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}
h2.pt{font-size:20px;margin:20px 0 12px;letter-spacing:-.02em}
.sec{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec a.more{font-size:13px;font-weight:500;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stat .k{color:var(--sub);font-size:12.5px}
.stat .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--sub);margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--sub)}.good{color:var(--ok)}
.rows{padding:4px 14px}
.crow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr)) 18px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow.head{color:var(--sub);font-size:12px;padding:10px 0 6px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img,.av{width:34px;height:34px;border-radius:50%;background:var(--soft);flex:none;object-fit:cover;display:inline-block}
.who .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .h{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num b{font-weight:700}.num .d{display:block;font-size:12px}
.chev{color:var(--sub)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--sub);padding:5px 11px;border-radius:8px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chart{position:relative;height:260px}
.split{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--soft);margin-top:10px}
.split i{display:block;height:100%}
.chhead{display:flex;align-items:center;gap:12px;margin:18px 0 12px}
.chhead img,.chhead .av{width:52px;height:52px;border-radius:50%;object-fit:cover}
.chhead .n{font-size:21px;font-weight:800;letter-spacing:-.02em}
.chhead .h{color:var(--sub);font-size:13px}
.chhead .yt{margin-left:auto;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:var(--card);white-space:nowrap}
.list{padding:2px 14px}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.thumb{width:92px;height:52px;border-radius:8px;background:var(--soft);flex:none;object-fit:cover}
.item .t{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--sub);margin-top:3px}
.item .g{margin-left:auto;text-align:right;flex:none;padding-left:6px;font-size:13px}
.item .g b{display:block;font-size:14px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:5px;vertical-align:1px}
.tag.s{background:var(--shorts);color:#fff}.tag.l{background:var(--soft);color:var(--ink)}
.empty{color:var(--sub);font-size:13.5px;padding:18px 0;text-align:center}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.filters .line{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.hl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hlh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px;font-size:14.5px}
.hlh .muted{font-size:11.5px;text-align:right}
.rank{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--soft)}
.rank.r0{background:#f2b705;color:#111}.rank.r1{background:#c9ccd3;color:#111}.rank.r2{background:#d08b52;color:#111}
.money{margin-bottom:12px}
.money .mh{display:flex;align-items:center;gap:10px}
.money .mh .n{font-weight:800;font-size:16px}
.money .mh img,.money .mh .av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.badge{margin-left:auto;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}
.badge.ok{background:var(--ok);color:#fff}
.tier{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tier .tn{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.tier .td{color:var(--sub);font-size:12px;margin:2px 0 8px}
.req{margin:10px 0}
.req .rl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.req .rl span:last-child{white-space:nowrap}
.pbar{height:9px;background:var(--soft);border-radius:5px;overflow:hidden;margin:5px 0 3px}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.pbar i.done{background:var(--ok)}
.req .rs{font-size:12px;color:var(--sub)}
.or{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:11.5px;margin:4px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.alt{opacity:.55}
.note{color:var(--sub);font-size:12.5px;line-height:1.55;margin:4px 2px 12px}
.tip{background:var(--tip);color:var(--tip-ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;margin:0 0 12px}
.tip b{font-weight:800}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--soft)}
.alert .at{font-size:14px;font-weight:700}
.alert .ad{font-size:12.5px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert .aw{margin-left:auto;flex:none;font-size:11.5px;color:var(--sub);white-space:nowrap;padding-left:6px}
.cp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.cp div{background:var(--soft);border-radius:10px;padding:7px 8px;font-size:12px}
.cp b{display:block;font-size:14px;margin-top:1px}
.cp .r{font-size:11.5px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--sub);font-weight:500;font-size:12px;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.hbar{display:grid;grid-template-columns:86px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.hbar .bar{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.hbar .bar i.best{background:var(--up)}
.hbar span:last-child{text-align:right;color:var(--sub)}
.bottom{display:none}
@media (max-width:860px){
  .top nav.tabs{display:none}
  .top .in{height:52px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;color:var(--sub);font-size:11px;font-weight:600}
  .bottom a .ic{font-size:19px;line-height:1.2;filter:grayscale(1);opacity:.7}
  .bottom a.on{color:var(--ink)}
  .bottom a.on .ic{filter:none;opacity:1}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.hl{grid-template-columns:minmax(0,1fr)}
  .stat .v{font-size:21px}
  .crow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 14px}
  .crow .hide-m{display:none}
  .chart{height:220px}
  .thumb{width:76px;height:43px}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">📊 채널 대시보드</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="upd" id="upd"></div>
</div></header>
<main class="wrap" id="app"></main>
<nav class="bottom" id="bottom"></nav>
<script>
const D = /*__DATA__*/null;
const PALETTE = ["#f2b705", "#e0392b", "#2b6de0", "#1f9d6b", "#8e44ad", "#ff7a00", "#00a3a3"];
const MENU = [["summary", "📊", "요약"], ["channel", "📺", "채널"], ["videos", "🎬", "영상"], ["money", "💰", "수익"], ["cost", "💵", "제작비"], ["insight", "💡", "인사이트"]];
const INSIGHTS = [["alerts", "🔔", "알림"], ["early", "📈", "새 영상 성적"], ["weekly", "🗓️", "주간 리포트"], ["engage", "❤️", "반응률"], ["timing", "⏰", "업로드 시간"], ["bench", "🔭", "벤치마크"]];
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const man = n => {
  if (n === null || n === undefined) return "-";
  const a = Math.abs(n);
  const f = (x, d) => (+x.toFixed(d)).toLocaleString("ko-KR");
  if (a >= 1e8) return f(n / 1e8, a >= 1e9 ? 0 : 1) + "억";
  if (a >= 1e4) return f(n / 1e4, a >= 1e5 ? 0 : 1) + "만";
  return (Math.round(n * 10) / 10).toLocaleString("ko-KR");
};
const dl = n => n === null || n === undefined ? '<span class="muted">내일부터</span>'
  : `<span class="${n > 0 ? "up" : n < 0 ? "down" : "muted"}">${n > 0 ? "▲" : n < 0 ? "▼" : "±"}${man(Math.abs(n))}</span>`;
const plus = n => n === null || n === undefined ? "-" : (n > 0 ? "+" : "") + man(n);
const pct = x => Math.floor(x * 10) / 10 + "%";
const color = name => PALETTE[Math.max(0, D.channels.findIndex(c => c.name === name)) % PALETTE.length];
const avatar = c => c.thumb ? `<img src="${esc(c.thumb)}" alt="" referrerpolicy="no-referrer">` : `<span class="av"></span>`;
const ago = iso => {
  const m = Math.round((new Date(D.updated.replace(" ", "T") + ":00+09:00") - new Date(iso)) / 60000);
  if (m < 60) return m <= 1 ? "방금" : `${m}분 전`;
  if (m < 60 * 24) return `${Math.round(m / 60)}시간 전`;
  return `${Math.round(m / 1440)}일 전`;
};
const tip = html => `<div class="tip">💡 ${html}</div>`;
let charts = [];
const state = { kind: "views", vch: "all", vtype: "all", vsort: "gain", ech: "all", bfor: "all" };
try { Object.assign(state, JSON.parse(localStorage.getItem("dash") || "{}")); } catch (e) {}
const remember = () => { try { localStorage.setItem("dash", JSON.stringify(state)); } catch (e) {} };

function chart(el, cfg) {
  if (!window.Chart || !el) return;
  Chart.defaults.color = css("--sub"); Chart.defaults.borderColor = css("--line");
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  charts.push(new Chart(el, cfg));
}
const tickY = { ticks: { callback: v => man(v) }, grid: { color: css("--line") } };
const tipCb = { callbacks: { label: x => `${x.dataset.label} ${man(x.raw)}` } };
const labels = () => D.series.dates.map(d => d.slice(5).replace("-", "/"));
const noSeries = () => D.series.dates.length ? "" : '<div class="empty">그래프는 이틀째부터 그려져요 (하루 증가량 = 오늘 − 어제)</div>';
const thumbImg = v => v.thumb ? `<img class="thumb" src="${esc(v.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<span class="thumb"></span>';
const typeTag = v => `<span class="tag ${v.short ? "s" : "l"}">${v.short ? "쇼츠" : "본편"}</span>`;

function videoItem(v, right, lead = "") {
  const dotc = D.channels.some(c => c.name === v.ch) ? `<span class="dot" style="background:${color(v.ch)}"></span> ` : "";
  return `<a class="item" href="${esc(v.url)}" target="_blank" rel="noopener">${lead}${thumbImg(v)}
    <div style="min-width:0"><div class="t">${esc(v.title)}</div>
      <div class="m">${typeTag(v)}${dotc}${esc(v.ch)}${v.published ? " · " + v.published : ""}</div></div>
    <div class="g">${right(v)}</div></a>`;
}
const ALERT_ICON = { surge: "🚀", upload: "🆕", early: "📈", goal: "🎉", money: "💰", weekly: "🗓️" };
function alertRow(a) {
  const inner = `<span class="ic">${ALERT_ICON[a.type] || "🔔"}</span>
    <div style="min-width:0"><div class="at">${esc(a.title)}</div><div class="ad">${esc(a.ch)}${a.detail ? " · " + esc(a.detail) : ""}</div></div>
    <span class="aw">${ago(a.t)}</span>`;
  return a.url ? `<a class="alert" href="${esc(a.url)}" ${a.url.startsWith("http") && !a.url.includes("channel-dashboard") ? 'target="_blank" rel="noopener"' : ""}>${inner}</a>` : `<div class="alert">${inner}</div>`;
}

/* ───────── 요약 ───────── */
function pageSummary() {
  const T = D.totals;
  const stat = (k, d, s) => `<div class="card stat"><div class="k">${k}</div><div class="v">${plus(d)}</div><div class="s">${s}</div></div>`;
  const hot = D.videos.filter(v => v.gain).sort((a, b) => b.gain - a.gain).slice(0, 5);
  const al = D.alerts.slice(0, 3);
  return `<h2 class="pt">오늘 한눈에</h2>
  <div class="grid4">
    ${stat("오늘 조회수", T.d_views, `누적 ${man(T.views)}`)}
    ${stat("오늘 쇼츠 조회수", T.d_shorts, `쇼츠 누적 ${man(T.shorts_views)}`)}
    ${stat("오늘 본편 조회수", T.d_long, `본편 누적 ${man(T.long_views)}`)}
    ${stat("오늘 구독자", T.d_subs, `전체 ${man(T.subs)}명`)}
  </div>
  <div class="sec"><span>🔔 최근 알림</span><a class="more" href="#insight/alerts">전체 보기 ›</a></div>
  <div class="card list">${al.length ? al.map(alertRow).join("") : '<div class="empty">아직 알림이 없어요. 급등·목표 달성·새 영상 성적이 생기면 여기에 떠요</div>'}</div>
  <div class="sec">채널별</div>
  <div class="card rows">
    <div class="crow head"><span>채널</span><span>구독자</span><span>총 조회수</span><span class="hide-m">쇼츠 / 본편</span><span></span></div>
    ${D.channels.map(c => `<a class="crow" href="#channel/${encodeURIComponent(c.name)}">
      <div class="who">${avatar(c)}<div style="min-width:0"><div class="n">${esc(c.name)}</div><div class="h">${esc(c.handle)}</div></div></div>
      <div class="num"><b>${c.hidden ? "비공개" : man(c.subs)}</b><span class="d">${dl(c.d_subs)}</span></div>
      <div class="num"><b>${man(c.views)}</b><span class="d">${dl(c.d_views)}</span></div>
      <div class="num hide-m"><b>${man(c.shorts_views)}</b> / ${man(c.long_views)}<span class="d muted">${c.shorts_count} · ${c.long_count}개</span></div>
      <span class="chev">›</span></a>`).join("")}
  </div>
  <div class="sec"><span>일별 조회수 증가</span>
    <span class="seg" id="kind">${[["views", "전체"], ["shorts", "쇼츠"], ["long", "본편"]].map(([k, l]) => `<button data-k="${k}" class="${state.kind === k ? "on" : ""}">${l}</button>`).join("")}</span></div>
  <div class="card">${noSeries() || '<div class="chart"><canvas id="c1"></canvas></div>'}</div>
  <div class="sec"><span>🔥 오늘 조회수 오른 영상</span><a class="more" href="#videos">전체 보기 ›</a></div>
  <div class="card list">${hot.length ? hot.map(v => videoItem(v, v => `<b class="up">▲${man(v.gain)}</b><span class="muted">${man(v.views)}</span>`)).join("") : '<div class="empty">내일부터 표시돼요 (어제와 비교)</div>'}</div>`;
}
function afterSummary() {
  const draw = () => {
    charts.forEach(c => c.destroy()); charts = [];
    chart($("#c1"), { type: "bar", data: { labels: labels(), datasets: D.channels.map(c => ({ label: c.name, data: D.series.by_channel[c.name][state.kind], backgroundColor: color(c.name), borderRadius: 3, stack: "s" })) },
      options: { maintainAspectRatio: false, interaction: { mode: "index" }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ...tickY } }, plugins: { tooltip: tipCb, legend: { labels: { boxWidth: 10, boxHeight: 10 } } } } });
  };
  document.querySelectorAll("#kind button").forEach(b => b.onclick = () => {
    state.kind = b.dataset.k; remember();
    document.querySelectorAll("#kind button").forEach(x => x.classList.toggle("on", x === b)); draw();
  });
  draw();
}

/* ───────── 영상 ───────── */
function pageVideos() {
  return `<h2 class="pt">영상</h2>
  <div class="filters">
    <div class="chips" id="vch">${[["all", "전체 채널"]].concat(D.channels.map(c => [c.name, c.name])).map(([k, l]) => `<button class="chip ${state.vch === k ? "on" : ""}" data-k="${esc(k)}">${k === "all" ? "" : `<span class="dot" style="background:${color(k)}"></span>`}${esc(l)}</button>`).join("")}</div>
    <div class="line">
      <span class="seg" id="vtype">${[["all", "전체"], ["short", "쇼츠"], ["long", "본편"]].map(([k, l]) => `<button data-k="${k}" class="${state.vtype === k ? "on" : ""}">${l}</button>`).join("")}</span>
      <span class="seg" id="vsort">${[["gain", "오늘 상승"], ["new", "최신"], ["views", "누적"]].map(([k, l]) => `<button data-k="${k}" class="${state.vsort === k ? "on" : ""}">${l}</button>`).join("")}</span>
    </div>
  </div>
  <div class="hl" id="hl"></div>
  <div class="sec" style="margin-top:18px">전체 목록</div>
  <div class="card list" id="vlist"></div>`;
}
function highlights(base) {
  const recent = base.filter(v => v.age <= 30);
  const byWeek = recent.some(v => v.gain7 > 0);
  const hot = recent.filter(v => byWeek ? v.gain7 > 0 : v.views > 0).sort((a, b) => byWeek ? b.gain7 - a.gain7 : b.per_day - a.per_day).slice(0, 3);
  const top = [...base].sort((a, b) => b.views - a.views).filter(v => v.views > 0).slice(0, 3);
  const box = (title, sub, arr, right) => `<div class="card"><div class="hlh"><b>${title}</b><span class="muted">${sub}</span></div>
    <div class="list" style="padding:0">${arr.length ? arr.map((v, k) => videoItem({ ...v, published: "" }, right, `<span class="rank r${k}">${k + 1}</span>`)).join("") : '<div class="empty">아직 없어요</div>'}</div></div>`;
  return box("🚀 최근 급등", byWeek ? "최근 7일 조회수 증가" : "최근 30일 업로드 · 하루 평균 조회수", hot,
      v => byWeek ? `<b class="up">▲${man(v.gain7)}</b><span class="muted">7일</span>` : `<b class="up">${man(v.per_day)}</b><span class="muted">회/일</span>`)
    + box("🏆 조회수 TOP", "누적 조회수", top, v => `<b>${man(v.views)}</b><span class="muted">회</span>`);
}
function afterVideos() {
  const draw = () => {
    let arr = D.videos.filter(v => (state.vch === "all" || v.ch === state.vch) && (state.vtype === "all" || (state.vtype === "short") === v.short));
    $("#hl").innerHTML = highlights(arr);
    if (state.vsort === "gain") arr.sort((a, b) => (b.gain ?? -1) - (a.gain ?? -1) || b.views - a.views);
    if (state.vsort === "new") arr.sort((a, b) => b.published.localeCompare(a.published));
    if (state.vsort === "views") arr.sort((a, b) => b.views - a.views);
    $("#vlist").innerHTML = arr.length ? arr.map(v => videoItem(v, v => state.vsort === "gain"
      ? `${v.gain === null ? '<b class="muted">-</b>' : `<b class="${v.gain > 0 ? "up" : "muted"}">${v.gain > 0 ? "▲" : ""}${man(v.gain)}</b>`}<span class="muted">${man(v.views)}</span>`
      : `<b>${man(v.views)}</b><span class="muted">👍 ${man(v.likes)}</span>`)).join("") : '<div class="empty">조건에 맞는 영상이 없어요</div>';
  };
  const bind = (id, key) => document.querySelectorAll(`#${id} [data-k]`).forEach(b => b.onclick = () => {
    state[key] = b.dataset.k; remember();
    document.querySelectorAll(`#${id} [data-k]`).forEach(x => x.classList.toggle("on", x === b)); draw();
  });
  bind("vch", "vch"); bind("vtype", "vtype"); bind("vsort", "vsort"); draw();
}

function pageInsight(sub) {
  const cur = INSIGHTS.some(x => x[0] === sub) ? sub : "alerts";
  const chips = `<div class="chips" style="margin-top:16px">${INSIGHTS.map(([k, ic, l]) => `<a class="chip ${k === cur ? "on" : ""}" href="#insight/${k}">${ic} ${l}</a>`).join("")}</div>`;
  return chips + { alerts: insAlerts, early: insEarly, weekly: insWeekly, engage: insEngage, timing: insTiming, bench: insBench }[cur]();
}
function channelFilter(key) {
  return `<div class="chips" id="flt" style="margin-bottom:12px">${[["all", "전체 채널"]].concat(D.channels.map(c => [c.name, c.name])).map(([k, l]) =>
    `<button class="chip ${state[key] === k ? "on" : ""}" data-k="${esc(k)}">${k === "all" ? "" : `<span class="dot" style="background:${color(k)}"></span>`}${esc(l)}</button>`).join("")}</div>`;
}
function insAlerts() {
  return `<h2 class="pt">🔔 알림</h2>
  ${tip(`채널에 좋은 일이 생기면 자동으로 기록돼요. <b>🚀 급등</b>(1시간 조회수가 평소의 ${D.settings.surge_ratio}배 이상, ${D.settings.surge_min}회 이상) · <b>🆕 새 영상</b> · <b>📈 24시간 성적</b> · <b>🎉 구독자·조회수 목표 돌파</b> · <b>💰 수익 조건 진행</b> · <b>🗓️ 주간 리포트</b>(월요일 오전).`)}
  <div class="card" style="margin-bottom:12px;display:flex;align-items:center;gap:10px">
    <span style="font-size:22px">📱</span>
    <div style="flex:1;min-width:0"><b>폰으로 바로 받기</b><div class="muted" style="font-size:12.5px">${D.telegram ? "텔레그램으로 알림이 전송되고 있어요 ✅" : "텔레그램을 연결하면 알림이 폰으로 바로 와요 (설정은 클로드에게 '텔레그램 연결해줘')"}</div></div>
  </div>
  <div class="card list">${D.alerts.length ? D.alerts.map(alertRow).join("") : '<div class="empty">아직 알림이 없어요.<br>오늘부터 기록이 쌓이면 급등·목표 달성·새 영상 성적이 여기에 떠요</div>'}</div>`;
}
function insEarly() {
  const list = D.videos.filter(v => (state.ech === "all" || v.ch === state.ech) && (Object.keys(v.early).length || v.age <= 3)).sort((a, b) => a.age - b.age);
  const cell = (v, h) => {
    const e = v.early[h];
    if (!e) return `<div><span class="muted">${h}시간</span><b class="muted">${v.age * 24 < h ? "대기 중" : "기록 전"}</b></div>`;
    const r = e.ratio;
    return `<div><span class="muted">${h}시간</span><b>${man(e.views)}회</b><span class="r ${r === null ? "muted" : r >= 1 ? "up" : "down"}">${r === null ? "비교 대기" : `평소의 ${r}배`}</span></div>`;
  };
  return `<h2 class="pt">📈 새 영상 성적</h2>
  ${tip("새 영상을 올리고 <b>6시간 · 24시간 · 48시간</b>에 조회수를 기록해서, 같은 채널의 다른 영상(쇼츠는 쇼츠끼리, 본편은 본편끼리)과 비교해요. <b>1배보다 크면 평소보다 잘 되는 중</b>이에요. 대시보드를 만든 뒤에 올린 영상부터 기록돼요.")}
  ${channelFilter("ech")}
  <div class="card list">${list.length ? list.map(v => `<a class="item" href="${esc(v.url)}" target="_blank" rel="noopener" style="display:block">
      <div style="display:flex;gap:12px;align-items:center">${thumbImg(v)}<div style="min-width:0"><div class="t">${esc(v.title)}</div>
        <div class="m">${typeTag(v)}<span class="dot" style="background:${color(v.ch)}"></span> ${esc(v.ch)} · 올린 지 ${v.age < 1 ? Math.round(v.age * 24) + "시간" : Math.floor(v.age) + "일"} · 지금 ${man(v.views)}회</div></div></div>
      <div class="cp">${[6, 24, 48].map(h => cell(v, String(h))).join("")}</div></a>`).join("")
    : '<div class="empty">아직 기록된 새 영상이 없어요.<br>새 영상을 올리면 6시간 뒤부터 성적이 쌓여요</div>'}</div>`;
}
function insWeekly() {
  const W = D.weekly;
  if (!W.days) return `<h2 class="pt">🗓️ 주간 리포트</h2>${tip("최근 7일 동안 채널이 얼마나 컸는지 정리해요. 매주 월요일 오전에 알림으로도 보내드려요.")}<div class="card"><div class="empty">기록이 하루치뿐이라 내일부터 계산돼요</div></div>`;
  return `<h2 class="pt">🗓️ 주간 리포트</h2>
  ${tip(`최근 ${W.days}일(${W.from.slice(5).replace("-", "/")} → ${W.to.slice(5).replace("-", "/")}) 동안 채널이 얼마나 컸는지 정리했어요. 7일치가 안 되면 쌓인 만큼만 계산해요.`)}
  <div class="grid4">
    <div class="card stat"><div class="k">조회수 증가</div><div class="v">${plus(W.total.d_views)}</div><div class="s">최근 ${W.days}일</div></div>
    <div class="card stat"><div class="k">구독자 증가</div><div class="v">${plus(W.total.d_subs)}</div><div class="s">최근 ${W.days}일</div></div>
    <div class="card stat"><div class="k">쇼츠 조회수</div><div class="v">${plus(W.total.d_shorts)}</div><div class="s">최근 ${W.days}일</div></div>
    <div class="card stat"><div class="k">본편 조회수</div><div class="v">${plus(W.total.d_long)}</div><div class="s">최근 ${W.days}일</div></div>
  </div>
  <div class="sec">채널별</div>
  ${W.channels.map(c => `<div class="card" style="margin-bottom:10px">
    <div class="who" style="margin-bottom:8px">${avatar(c)}<div class="n">${esc(c.name)}</div><span class="muted" style="margin-left:auto;font-size:12.5px">새 영상 ${c.uploads}개</span></div>
    <div class="cp">
      <div><span class="muted">조회수</span><b>${plus(c.d_views)}</b><span class="r muted">쇼츠 ${plus(c.d_shorts)} · 본편 ${plus(c.d_long)}</span></div>
      <div><span class="muted">구독자</span><b>${plus(c.d_subs)}</b><span class="r muted">${c.subs_per_1k === null ? "-" : `1,000회당 ${c.subs_per_1k}명`}</span></div>
      <div><span class="muted">광고 수익 조건</span><b>${pct(c.ads_now)}</b><span class="r ${c.ads_before !== null && c.ads_now > c.ads_before ? "up" : "muted"}">${c.ads_before === null ? "비교 대기" : `${plus(Math.round((c.ads_now - c.ads_before) * 10) / 10)}%p`}</span></div>
    </div>
    ${c.best ? `<div style="margin-top:8px">${videoItem({ ...c.best, ch: c.name, published: "" }, v => `<b class="up">▲${man(v.gain)}</b><span class="muted">이번 주 1위</span>`)}</div>` : ""}
  </div>`).join("")}`;
}
function insEngage() {
  const rows = D.channels.map(c => {
    const views = c.shorts_views + c.long_views;
    const w = D.weekly.channels.find(x => x.name === c.name);
    return { c, like: views ? c.likes / views * 100 : null, comment: views ? c.comments / views * 100 : null, spk: w ? w.subs_per_1k : null };
  });
  const fans = D.videos.filter(v => v.views >= 30 && v.like_rate !== null).sort((a, b) => b.like_rate - a.like_rate).slice(0, 8);
  return `<h2 class="pt">❤️ 반응률</h2>
  ${tip("조회수만 보면 놓치는 것 — <b>본 사람 중 몇 %가 좋아요·댓글을 눌렀는지</b>, <b>1,000회 볼 때 구독자가 몇 명 늘었는지</b>예요. 반응률이 높은 영상은 팬을 만드는 영상이라 비슷한 주제를 더 만들면 좋아요. (보통 좋아요율 2~5%면 괜찮은 편)")}
  <div class="card scroll"><table class="tbl">
    <tr><th>채널</th><th>좋아요율</th><th>댓글율</th><th>1,000회당 구독</th></tr>
    ${rows.map(r => `<tr><td><span class="dot" style="background:${color(r.c.name)}"></span> ${esc(r.c.name)}</td>
      <td><b>${r.like === null ? "-" : r.like.toFixed(1) + "%"}</b></td><td>${r.comment === null ? "-" : r.comment.toFixed(2) + "%"}</td>
      <td>${r.spk === null ? '<span class="muted">내일부터</span>' : r.spk + "명"}</td></tr>`).join("")}
  </table></div>
  <div class="sec">💖 팬을 만드는 영상 <span class="muted" style="font-size:12.5px;font-weight:500">좋아요율 순 · 조회수 30회 이상</span></div>
  <div class="card list">${fans.length ? fans.map(v => videoItem(v, v => `<b class="up">${v.like_rate.toFixed(1)}%</b><span class="muted">👍 ${man(v.likes)} · 💬 ${man(v.comments)}</span>`)).join("") : '<div class="empty">아직 없어요</div>'}</div>`;
}
function insTiming() {
  const T = D.timing;
  const bars = arr => {
    const max = Math.max(...arr.map(x => x.avg || 0), 1);
    const best = arr.filter(x => x.avg).sort((a, b) => b.avg - a.avg)[0];
    return arr.map(x => `<div class="hbar"><span>${x.label}</span><div class="bar"><i class="${best && x === best ? "best" : ""}" style="width:${(x.avg || 0) / max * 100}%"></i></div>
      <span>${x.avg === null ? "영상 없음" : man(Math.round(x.avg)) + "회 · " + x.n + "개"}</span></div>`).join("");
  };
  const best = [...T.slot, ...T.weekday].filter(x => x.avg && x.n >= 2).sort((a, b) => b.avg - a.avg)[0];
  return `<h2 class="pt">⏰ 업로드 시간</h2>
  ${tip(`어느 요일·시간대에 올린 영상이 잘 됐는지 비교해요. 막대 숫자는 그 시간에 올린 영상들의 <b>평균 하루 조회수</b>(24시간 기록이 3개 이상 쌓이면 24시간 조회수)예요. 지금은 영상 ${T.n}개 기준이라 <b>참고용</b>이고, 영상이 20개 넘게 쌓이면 믿을 만해져요.`)}
  ${best ? `<div class="card" style="margin-bottom:10px">지금까지는 <b class="up">${best.label}</b>에 올린 영상이 가장 잘 됐어요 <span class="muted">(영상 ${best.n}개 평균)</span></div>` : ""}
  <div class="grid2">
    <div class="card"><div class="hlh"><b>시간대별</b><span class="muted">한국 시간</span></div>${bars(T.slot)}</div>
    <div class="card"><div class="hlh"><b>요일별</b><span class="muted">한국 시간</span></div>${bars(T.weekday)}</div>
  </div>`;
}
function insBench() {
  const B = D.bench;
  const fors = ["all", ...new Set(B.channels.map(c => c.for).filter(Boolean))];
  const names = new Set(B.channels.filter(c => state.bfor === "all" || c.for === state.bfor).map(c => c.name));
  const vids = B.videos.filter(v => names.has(v.ch)).slice(0, 20);
  return `<h2 class="pt">🔭 벤치마크</h2>
  ${tip("비슷한 주제의 <b>인기 채널</b>에서 최근 14일 안에 올라온 영상 중 <b>하루 조회수가 높은 순</b>이에요. 요즘 어떤 주제·제목이 먹히는지 아이디어를 얻는 용도예요. 6시간마다 새로 확인해요.")}
  <div class="chips" id="bfor" style="margin-bottom:12px">${fors.map(k => `<button class="chip ${state.bfor === k ? "on" : ""}" data-k="${esc(k)}">${k === "all" ? "전체" : esc(k) + " 참고"}</button>`).join("")}</div>
  <div class="card scroll" style="margin-bottom:10px"><table class="tbl">
    <tr><th>참고 채널</th><th>구독자</th><th>우리 채널</th></tr>
    ${B.channels.filter(c => names.has(c.name)).map(c => `<tr><td><a href="${esc(c.url)}" target="_blank" rel="noopener"><b>${esc(c.name)}</b> <span class="muted">↗</span></a></td><td>${man(c.subs)}</td><td class="muted">${esc(c.for)}</td></tr>`).join("")}
  </table></div>
  <div class="sec">🔥 요즘 뜨는 영상</div>
  <div class="card list">${vids.length ? vids.map(v => videoItem(v, v => `<b class="up">${man(v.per_day)}</b><span class="muted">회/일</span>`)).join("") : '<div class="empty">다음 수집 때 채워져요</div>'}</div>
  <div class="note">참고 채널을 바꾸거나 추가하고 싶으면 클로드에게 채널 주소를 알려주세요.${B.at ? ` · 마지막 확인 ${ago(B.at)}` : ""}</div>`;
}
function afterInsight(sub) {
  const rerender = () => { $("#app").innerHTML = pageInsight(sub); afterInsight(sub); };
  document.querySelectorAll("#flt [data-k]").forEach(b => b.onclick = () => { state.ech = b.dataset.k; remember(); rerender(); });
  document.querySelectorAll("#bfor [data-k]").forEach(b => b.onclick = () => { state.bfor = b.dataset.k; remember(); rerender(); });
}

/* ───────── 라우팅 ───────── */
function route() {
  if (!D) { $("#app").innerHTML = '<div class="empty">아직 수집 전이에요</div>'; return; }
  const [page, arg] = (location.hash.slice(1) || "summary").split("/");
  const a = arg ? decodeURIComponent(arg) : null;
  const cur = MENU.some(m => m[0] === page) ? page : "summary";
  const nav = MENU.map(([k, ic, l]) => `<a href="#${k}" class="${k === cur ? "on" : ""}"><span class="ic">${ic}</span>${l}</a>`).join("");
  $("#tabs").innerHTML = nav; $("#bottom").innerHTML = nav;
  charts.forEach(c => c.destroy()); charts = [];
  const pages = { summary: [pageSummary, afterSummary], channel: [() => pageChannel(a), () => afterChannel(a)], videos: [pageVideos, afterVideos],
    money: [() => pageMoney(a), () => {}], cost: [() => pageCost(a), () => {}], insight: [() => pageInsight(a), () => afterInsight(a)] };
  $("#app").innerHTML = pages[cur][0]();
  pages[cur][1]();
  window.scrollTo(0, 0);
}
if (D) $("#upd").innerHTML = `업데이트 ${D.updated.slice(5).replace("-", "/")}<br><span style="font-size:11px">10분마다 자동</span>`;
window.addEventListener("hashchange", route);
if (window.Chart || document.readyState === "complete") route(); else window.addEventListener("load", route);
</script>
</body>
</html>
