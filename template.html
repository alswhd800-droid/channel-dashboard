<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="600">
<meta name="theme-color" content="#111114">
<title>채널 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f5f4f1;--card:#fff;--ink:#16161a;--sub:#6d6d75;--line:#e7e5e0;--soft:#efeee9;--up:#e0392b;--down:#2b6de0;--shorts:#ff3d55;--long:#3a3a42;--ok:#1f9d6b;--accent:#16161a;--accent-ink:#fff;--tip:#f0f2f6;--tip-ink:#4b5160;--warnbg:#fff7d6;--warnink:#5b4a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--card:#19191e;--ink:#f1f1f4;--sub:#9b9ba4;--line:#2a2a31;--soft:#222228;--long:#c7c7cf;--accent:#f1f1f4;--accent-ink:#111114;--tip:#1d2027;--tip-ink:#aeb4c0;--warnbg:#2a2615;--warnink:#f3dd8a}}
:root[data-theme="dark"]{--bg:#0f0f12;--card:#19191e;--ink:#f1f1f4;--sub:#9b9ba4;--line:#2a2a31;--soft:#222228;--long:#c7c7cf;--accent:#f1f1f4;--accent-ink:#111114;--tip:#1d2027;--tip-ink:#aeb4c0;--warnbg:#2a2615;--warnink:#f3dd8a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.logo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#ff3d55,#ff8a3d);box-shadow:inset 0 0 0 5px color-mix(in srgb,#fff 18%,transparent)}
.upd{color:var(--sub);font-size:12px;margin-left:auto;text-align:right;white-space:nowrap}
nav.tabs{display:flex;gap:2px}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;color:var(--sub);font-weight:600;font-size:14.5px;white-space:nowrap;transition:background .15s,color .15s}
nav.tabs a:hover{color:var(--ink);background:var(--soft)}
nav.tabs a .ic{display:none}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
h2.pt{font-size:22px;margin:24px 0 4px;letter-spacing:-.03em}
.pd{color:var(--sub);font-size:13.5px;margin:0 0 14px}
.sec{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:28px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec a.more{font-size:13px;font-weight:500;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stat .k{color:var(--sub);font-size:13px;font-weight:600}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.stat .s{font-size:12.5px;color:var(--sub);margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--sub)}.good{color:var(--ok)}
.rows{padding:4px 14px}
.crow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr)) 18px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow.head{color:var(--sub);font-size:12px;padding:10px 0 6px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img,.av{width:34px;height:34px;border-radius:50%;background:var(--soft);flex:none;object-fit:cover;display:inline-block}
.who .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .h{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num b{font-weight:700}.num .d{display:block;font-size:12px}
.chev{color:var(--sub)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--sub);padding:5px 11px;border-radius:8px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chart{position:relative;height:260px}
.split{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--soft);margin-top:10px}
.split i{display:block;height:100%}
.chhead{display:flex;align-items:center;gap:12px;margin:18px 0 12px}
.chhead img,.chhead .av{width:52px;height:52px;border-radius:50%;object-fit:cover}
.chhead .n{font-size:21px;font-weight:800;letter-spacing:-.02em}
.chhead .h{color:var(--sub);font-size:13px}
.chhead .yt{margin-left:auto;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:var(--card);white-space:nowrap}
.list{padding:2px 14px}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.thumb{width:92px;height:52px;border-radius:8px;background:var(--soft);flex:none;object-fit:cover}
.item .t{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--sub);margin-top:3px}
.item .g{margin-left:auto;text-align:right;flex:none;padding-left:6px;font-size:13px}
.item .g b{display:block;font-size:14px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:5px;vertical-align:1px}
.tag.s{background:var(--shorts);color:#fff}.tag.l{background:var(--soft);color:var(--ink)}
.empty{color:var(--sub);font-size:13.5px;padding:18px 0;text-align:center}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.filters .line{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.hl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hlh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px;font-size:14.5px}
.hlh .muted{font-size:11.5px;text-align:right}
.rank{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--soft)}
.rank.r0{background:#f2b705;color:#111}.rank.r1{background:#c9ccd3;color:#111}.rank.r2{background:#d08b52;color:#111}
.money{margin-bottom:12px}
.money .mh{display:flex;align-items:center;gap:10px}
.money .mh .n{font-weight:800;font-size:16px}
.money .mh img,.money .mh .av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.badge{margin-left:auto;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}
.badge.ok{background:var(--ok);color:#fff}
.tier{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tier .tn{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.tier .td{color:var(--sub);font-size:12px;margin:2px 0 8px}
.req{margin:10px 0}
.req .rl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.req .rl span:last-child{white-space:nowrap}
.pbar{height:9px;background:var(--soft);border-radius:5px;overflow:hidden;margin:5px 0 3px}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.pbar i.done{background:var(--ok)}
.req .rs{font-size:12px;color:var(--sub)}
.or{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:11.5px;margin:4px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.alt{opacity:.55}
.note{color:var(--sub);font-size:12.5px;line-height:1.55;margin:4px 2px 12px}
.guide .gh{font-weight:800;font-size:15.5px;margin-bottom:6px}
.gs{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;line-height:1.5}
.gs .num{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--accent);color:var(--accent-ink);margin-top:1px}
.gs .muted{font-size:12.5px}
.gp{margin-top:4px}
.gx{font-size:12.5px;line-height:1.55;color:var(--sub);padding:8px 0 0;border-top:1px solid var(--line);margin-top:8px}
.gx b{color:var(--ink)}
.warn{background:var(--warnbg);color:var(--warnink);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;margin-top:8px}
.step{font-size:12px;font-weight:800;color:var(--sub);margin:14px 0 -4px}
.req .rv{font-size:12px;color:var(--ink);margin-top:2px}
.pace{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:4px 10px;font-size:12.5px;margin-top:6px}
.pace b{white-space:nowrap}
.tip{background:var(--tip);color:var(--tip-ink);border-radius:12px;padding:10px 12px 10px 14px;font-size:13px;line-height:1.6;margin:0 0 14px;border-left:3px solid var(--line)}
.tip b{font-weight:700;color:var(--ink)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--soft)}
.alert .at{font-size:14px;font-weight:700}
.alert .ad{font-size:12.5px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert .aw{margin-left:auto;flex:none;font-size:11.5px;color:var(--sub);white-space:nowrap;padding-left:6px}
.cp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.cp div{background:var(--soft);border-radius:10px;padding:7px 8px;font-size:12px}
.cp b{display:block;font-size:14px;margin-top:1px}
.cp .r{font-size:11.5px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--sub);font-weight:500;font-size:12px;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.hbar{display:grid;grid-template-columns:86px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.hbar .bar{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.hbar .bar i.best{background:var(--up)}
.hbar span:last-child{text-align:right;color:var(--sub)}
.bottom{display:none}
@media (max-width:860px){
  .top nav.tabs{display:none}
  .top .in{height:52px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;color:var(--sub);font-size:11px;font-weight:600}
  .bottom a .ic{font-size:19px;line-height:1.2;filter:grayscale(1);opacity:.7}
  .bottom a.on{color:var(--ink)}
  .bottom a.on .ic{filter:none;opacity:1}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.hl{grid-template-columns:minmax(0,1fr)}
  .stat .v{font-size:21px}
  .crow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 14px}
  .crow .hide-m{display:none}
  .chart{height:220px}
  .thumb{width:76px;height:43px}
}

.hunt .rank{width:22px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.hunt .hg{text-align:right}
.hunt .mult{font-weight:800;color:#e0392b;font-size:15px;line-height:1.2}
.hunt .sub2{color:var(--sub);font-size:11px;margin-top:2px;white-space:nowrap}
.segs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.topic{border-top:1px solid var(--line);padding:14px 0}.topic:first-of-type{border-top:0}
.topic .hd{display:flex;gap:10px;align-items:flex-start}
.topic .sc{flex:none;min-width:46px;text-align:center;border-radius:12px;padding:6px 4px;font-weight:800;font-size:18px;line-height:1.1;background:var(--soft)}
.topic .sc small{display:block;font-size:10px;font-weight:600;color:var(--sub)}
.topic .sc.hi{background:#e0392b;color:#fff}.topic .sc.hi small{color:#ffe3df}
.topic .nm{font-weight:800;font-size:15.5px;line-height:1.35}
.topic .ti{margin-top:3px;font-size:13.5px;color:var(--ink)}
.topic .fs{margin-top:4px;font-size:12.5px;color:var(--sub)}
.topic .why{margin:9px 0 0;font-size:13px;line-height:1.6}
.topic .bars{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:11.5px;color:var(--sub)}
.topic .bars b{color:var(--ink)}
.topic .ev{margin-top:8px;display:grid;gap:4px}
.topic .ev a{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tg{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--sub);white-space:nowrap}
.tg.new{background:color-mix(in srgb,#2b6de0 15%,transparent);color:#2b6de0}
.tg.fu{background:color-mix(in srgb,#e0392b 13%,transparent);color:#e0392b}
.topic .ttl{display:flex;gap:8px;align-items:flex-start;margin-top:9px;background:var(--soft);border-radius:10px;padding:8px 10px}
.topic .ttl .tx{flex:1;min-width:0;font-size:14px;font-weight:650;line-height:1.45}
.topic .ttl .ko{display:block;font-size:12.5px;font-weight:500;color:var(--sub);margin-top:2px}
.copy{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:600;cursor:pointer;min-height:28px}
.copy.ok{color:var(--ok);border-color:var(--ok)}
.sbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px}
.sbar div{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar b{color:var(--ink)}
.sbar i{display:block;height:4px;border-radius:2px;background:var(--soft);margin-top:3px;overflow:hidden}
.sbar u{display:block;height:100%;background:var(--ink);opacity:.7}
.topic details.memo{margin-top:9px;font-size:12.5px;color:var(--sub)}
.topic details.memo summary{cursor:pointer;font-weight:700;padding:4px 0}
.topic .dl{display:grid;gap:8px;margin-top:6px;color:var(--ink);line-height:1.55;border-left:2px solid var(--line);padding-left:10px}
.topic .dl .k{font-size:11px;font-weight:800;color:var(--sub);margin-bottom:1px}
.topic .dl ul{margin:0;padding-left:18px}
.tbar{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--soft);padding:3px 9px;font-size:11.5px;color:var(--sub);white-space:nowrap}
.pill b{color:var(--ink);font-weight:700}
.how{margin:0 0 10px;font-size:12.5px;color:var(--tip-ink);background:var(--tip);border-radius:12px;padding:9px 12px}
.how summary{cursor:pointer;font-weight:700}
.how p{margin:8px 0 2px;line-height:1.6}.how b{color:var(--ink)}
.chip .cn{font-size:11.5px;opacity:.65;font-weight:600}
.hunt .hm{display:none}
.acts{display:flex;gap:6px;flex:none}
.star{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;min-width:32px;min-height:28px;font-size:15px;line-height:1;cursor:pointer}
.star.on{color:#f2b705;border-color:#f2b705}
.hist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.hist summary{cursor:pointer;font-weight:700;color:var(--sub);padding:4px 0}
.hrun{margin-top:10px}.hrun>.k{font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:4px}
.hrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.hrow .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .m{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsc.sm{width:32px;height:32px;border-radius:9px;font-size:12.5px}
.ch2{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:-.02em;margin:0 0 12px}
.ch2 .when{font-size:12px;font-weight:500;color:var(--sub)}
.tmini{padding:12px 0}
.tmini>div{flex:1}
.tmini .chev{margin-left:auto;padding-left:8px}
.tsc{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--soft)}
.tsc.hi{background:#e0392b;color:#fff}
.tmini .m{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:13px;font-weight:500;color:var(--sub)}
.huntmeta{color:var(--sub);font-size:11px;margin:2px 0 8px}
.when{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
@media(max-width:520px){.hunt .sub2{font-size:10px}.hunt .rank{width:16px}.hunt .hg{display:none}.hunt .hm{display:block;margin-top:2px}.hunt .hm .mult{display:inline;font-size:13px}.sbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}}

/* ───── 마케팅팀·제작 현황·채널 효율·업로드 달력 (2026-09-27) ───── */
.face{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1;border:2px solid var(--line);background:var(--soft)}
.face.lg{width:56px;height:56px;font-size:28px}
.face.sm{width:26px;height:26px;font-size:13px;border-width:1.5px}
.say{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px}
.bub{flex:1;min-width:0;background:var(--tip);color:var(--tip-ink);border-radius:4px 14px 14px 14px;padding:9px 12px 10px;font-size:13px;line-height:1.62}
.bub b{color:var(--ink);font-weight:700}
.nm2{font-size:11.5px;color:var(--sub);margin-bottom:2px}.nm2 b{color:var(--ink);font-size:12.5px;margin-right:5px}
.tone{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:0 6px;vertical-align:1px}
.tone.good{background:color-mix(in srgb,#1f9d6b 17%,transparent);color:#1f9d6b}

/* 소리로 듣기: 브라우저에 든 한국어 음성으로 읽는다(무료·토큰 0). 남자 음성이 없으면 같은 음성의 높낮이로 사람을 나눈다 */
const TTS = { ok: typeof window !== "undefined" && "speechSynthesis" in window, voices: [] };
const MALE = /injoon|hyunsu|bongjin|gookmin|minsu|jinho|male|남성/i;
function ttsLoad() {
  if (!TTS.ok) return;
  try { TTS.voices = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang)).sort((x, y) => (y.localService ? 1 : 0) - (x.localService ? 1 : 0)); } catch (e) { TTS.voices = []; }   // 기기 안 음성 먼저(인터넷 음성은 끊기기 쉬움)
  const b = $("[data-mp=sound]"); if (b) b.hidden = !TTS.voices.length;
}
if (TTS.ok) try { speechSynthesis.addEventListener("voiceschanged", ttsLoad); } catch (e) {}
function ttsVoice(who) {
  const g = ((STAFF[who] || {}).voice || {}).g, m = TTS.voices.filter(v => MALE.test(v.name)), f = TTS.voices.filter(v => !MALE.test(v.name));
  const pool = g === "m" ? (m.length ? m : f) : (f.length ? f : m);
  return pool.length ? pool[Math.max(0, Object.keys(STAFF).indexOf(who)) % pool.length] : null;
}
const ttsText = s => s.replace(/\*\*/g, "").replace(/(\d{1,2})\/(\d{1,2})/g, (_, a, b) => `${+a}월 ${+b}일`).replace(/[·—|]/g, ", ")
  .replace(/\+(?=\d)/g, "").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "").replace(/['‘’"“”]/g, "");
function ttsUnlock() { try { if (TTS.ok) speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch (e) {} }   // 아이폰은 첫 소리를 버튼 누를 때 내야 한다
function ttsSay(l) {
  if (!TTS.ok || !TTS.voices.length) return null;
  return new Promise(res => {
    let done = false;
    const end = () => { if (!done) { done = true; res(); } };
    try {
      const who = l.who === "all" ? "lead" : l.who, vv = (STAFF[who] || {}).voice || {}, voice = ttsVoice(who);
      const text = ttsText(l.text), parts = (text.match(/[^.!?]+[.!?]*/g) || [text]).map(x => x.trim()).filter(Boolean);
      parts.forEach((t, k) => {
        const u = new SpeechSynthesisUtterance(t);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "ko-KR";
        u.pitch = vv.g === "m" && !(voice && MALE.test(voice.name)) ? Math.min(vv.pitch || 1, 0.78) : (vv.pitch || 1);
        u.rate = (vv.rate || 1) * (MP.fast ? 1.4 : 1.08);
        u.onerror = end;
        if (k === parts.length - 1) u.onend = end;
        speechSynthesis.speak(u);
      });
      setTimeout(end, 3000 + text.length * 170);   // 끝났다는 신호가 안 와도 멈추지 않게
    } catch (e) { end(); }
  });
}
function bindMeeting() {

    if (k === "end") mpEnd();

    if (k === "sound") {
      MP.sound = !MP.sound; b.setAttribute("aria-pressed", String(MP.sound)); b.textContent = MP.sound ? "🔊 소리 켜짐" : "🔈 소리로 듣기";
      if (MP.sound) { ttsUnlock(); if (!MP.on) mpPlay(MP.ended); } else try { speechSynthesis.cancel(); } catch (e) {}
    }
  });
  const fb = call.querySelector("[data-mp=fast]"); if (fb) fb.setAttribute("aria-pressed", String(MP.fast));
  const sb = call.querySelector("[data-mp=sound]"); if (sb && MP.sound) { sb.setAttribute("aria-pressed", "true"); sb.textContent = "🔊 소리 켜짐"; }
  ttsLoad(); setTimeout(ttsLoad, 900); setTimeout(ttsLoad, 2500);   // 아이폰 사파리는 음성 목록이 늦게 온다

  return `<h2 class="pt">영상</h2>${say("reviewer", "우리 채널 영상을 한눈에 봐요. <b>어제 늘어난 조회</b>순으로 보면 지금 뜨는 편이, <b>하루 평균</b>순으로 보면 오래 꾸준한 편이 보여요. 새 영상의 6·24·48시간 성적은 인사이트 → 새 영상 성적에 있어요.")}
  <div class="filters">
    <div class="chips" id="vch">${[["all", "전체 채널"]].concat(D.channels.map(c => [c.name, c.name])).map(([k, l]) => `<button class="chip ${state.vch === k ? "on" : ""}" data-k="${esc(k)}">${k === "all" ? "" : `<span class="dot" style="background:${color(k)}"></span>`}${esc(l)}</button>`).join("")}</div>
    <div class="line">
      <span class="seg" id="vtype">${[["all", "전체"], ["short", "쇼츠"], ["long", "본편"]].map(([k, l]) => `<button data-k="${k}" class="${state.vtype === k ? "on" : ""}">${l}</button>`).join("")}</span>
      <span class="seg" id="vsort">${[["gain", "오늘 상승"], ["new", "최신"], ["views", "누적"]].map(([k, l]) => `<button data-k="${k}" class="${state.vsort === k ? "on" : ""}">${l}</button>`).join("")}</span>
    </div>
  </div>
  <div class="hl" id="hl"></div>
  <div class="sec" style="margin-top:18px">전체 목록</div>
  <div class="card list" id="vlist"></div>`;
}
function highlights(base) {
  const recent = base.filter(v => v.age <= 30);
  const byWeek = recent.some(v => v.gain7 > 0);
  const hot = recent.filter(v => byWeek ? v.gain7 > 0 : v.views > 0).sort((a, b) => byWeek ? b.gain7 - a.gain7 : b.per_day - a.per_day).slice(0, 3);
  const top = [...base].sort((a, b) => b.views - a.views).filter(v => v.views > 0).slice(0, 3);
  const box = (title, sub, arr, right) => `<div class="card"><div class="hlh"><b>${title}</b><span class="muted">${sub}</span></div>
    <div class="list" style="padding:0">${arr.length ? arr.map((v, k) => videoItem({ ...v, published: "" }, right, `<span class="rank r${k}">${k + 1}</span>`)).join("") : '<div class="empty">아직 없어요</div>'}</div></div>`;
  return box("🚀 최근 급등", byWeek ? "최근 7일 조회수 증가" : "최근 30일 업로드 · 하루 평균 조회수", hot,
      v => byWeek ? `<b class="up">▲${man(v.gain7)}</b><span class="muted">7일</span>` : `<b class="up">${man(v.per_day)}</b><span class="muted">회/일</span>`)
    + box("🏆 조회수 TOP", "누적 조회수", top, v => `<b>${man(v.views)}</b><span class="muted">회</span>`);
}
function afterVideos() {
  const draw = () => {
    let arr = D.videos.filter(v => (state.vch === "all" || v.ch === state.vch) && (state.vtype === "all" || (state.vtype === "short") === v.short));
    $("#hl").innerHTML = highlights(arr);
    if (state.vsort === "gain") arr.sort((a, b) => (b.gain ?? -1) - (a.gain ?? -1) || b.views - a.views);
    if (state.vsort === "new") arr.sort((a, b) => b.published.localeCompare(a.published));
    if (state.vsort === "views") arr.sort((a, b) => b.views - a.views);
    $("#vlist").innerHTML = arr.length ? arr.map(v => videoItem(v, v => state.vsort === "gain"
      ? `${v.gain === null ? '<b class="muted">-</b>' : `<b class="${v.gain > 0 ? "up" : "muted"}">${v.gain > 0 ? "▲" : ""}${man(v.gain)}</b>`}<span class="muted">${man(v.views)}</span>`
      : `<b>${man(v.views)}</b><span class="muted">👍 ${man(v.likes)}</span>`)).join("") : '<div class="empty">조건에 맞는 영상이 없어요</div>';
  };
  const bind = (id, key) => document.querySelectorAll(`#${id} [data-k]`).forEach(b => b.onclick = () => {
    state[key] = b.dataset.k; remember();
    document.querySelectorAll(`#${id} [data-k]`).forEach(x => x.classList.toggle("on", x === b)); draw();
  });
  bind("vch", "vch"); bind("vtype", "vtype"); bind("vsort", "vsort"); draw();
}

/* ───────── 수익 ───────── */
const span = d => d === null || d === undefined ? "-" : d <= 60 ? `약 ${man(d)}일` : d <= 365 ? `약 ${Math.round(d / 30)}개월` : `약 ${(d / 365).toFixed(1)}년`;
const moneyGuide = () => {
  const m = D.channels.length ? D.channels[0].money : null;
  return `<div class="card guide" style="margin-bottom:12px">
    <div class="gh">💰 광고 수익 받는 법 — 이것만 채우면 돼요</div>
    <div class="gs"><span class="num">1</span><div><b>구독자 1,000명</b> <span class="muted">· 꼭 필요</span></div></div>
    <div class="gs"><span class="num">2</span><div><b>그리고 둘 중 하나만</b>
      <div class="gp">🎬 본편 시청 시간 <b>4,000시간</b> <span class="muted">· 최근 12개월</span></div>
      <div class="gp">📱 쇼츠 조회수 <b>1,000만 회</b> <span class="muted">· 최근 90일</span></div></div></div>
    <div class="gs"><span class="num">3</span><div><b>신청</b> <span class="muted">· YouTube 스튜디오 → 수익 창출. 구글 계정 2단계 인증 · 애드센스 연결 · 커뮤니티 경고 없음. 심사는 보통 1개월</span></div></div>
    <div class="warn">⏰ <b>2027년 2월 1일부터</b> 새로 신청하는 채널은 <b>본편 8,000시간 또는 쇼츠 2,000만 회</b>로 두 배가 돼요. 그 전에 채우고 신청하는 게 목표${m ? ` <b>(D-${m.days_left})</b>` : ""}. 같은 날부터 쇼츠 광고 수익은 가입 뒤에도 90일 1,000만 회를 넘는 동안만 나와요.</div>
    <div class="gx"><b>조회수로 보면</b> 본편 10분짜리를 평균 35% 본다고 치면 4,000시간 ≈ <b>본편 조회수 약 7만 회</b>. 쇼츠 길은 1,000만 회(90일)라, 작은 채널은 <b>본편 길이 훨씬 가까워요</b>.</div>
    <div class="gx"><b>안 세는 것</b> 쇼츠를 본 시간(4,000시간에 안 들어감) · 비공개·일부공개·삭제한 영상 · 광고로 산 조회. 영상을 지우거나 비공개로 돌리면 그만큼 깎여요.</div>
    <div class="gx"><b>심사에서 떨어지는 것</b> 틀이 거의 같고 설명이 적은 양산형 · AI로 찍어낸 느낌 · 남의 영상 재사용 · AI 인물이 건강·돈·법을 설명. 영상 하나가 아니라 채널 전체를 봐요.</div>
  </div>`;
};
function pageMoney(name) {
  const sel = name && D.channels.find(c => c.name === name);
  const chips = `<div class="chips" style="margin-top:16px">${[["", "전체"]].concat(D.channels.map(c => [c.name, c.name])).map(([k, l]) =>
    `<a class="chip ${(sel ? sel.name : "") === k ? "on" : ""}" href="#money${k ? "/" + encodeURIComponent(k) : ""}">${k ? `<span class="dot" style="background:${color(k)}"></span>` : ""}${esc(l)}</a>`).join("")}</div>`;
  const adOf = c => c.money.tiers.find(t => t.key === "ads");
  const blockText = ad => {
    const by = Object.fromEntries(ad.items.map(i => [i.key, i]));
    if (ad.done) return "조건 달성 · 신청하세요";
    const b = by[ad.block];
    return b.key === "subs" ? `막힌 곳: 구독자 ${man(b.left)}명 남음`
      : b.key === "watch" ? `막힌 곳: 본편 시청 ${man(Math.ceil(b.left))}시간 남음` : `막힌 곳: 쇼츠 ${man(b.left)}회 남음`;
  };

    return `${chips}<h2 class="pt">광고 수익까지</h2>

    ${moneyGuide()}
    <div class="card rows">${D.channels.map(c => {
      const ad = adOf(c);
      return `<a class="crow" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 14px" href="#money/${encodeURIComponent(c.name)}">
        <div class="who">${avatar(c)}<div style="min-width:0"><div class="n">${esc(c.name)}</div><div class="h">구독자 ${man(c.subs)}명</div></div></div>
        <div><div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="muted">광고 수익</span><b class="${ad.done ? "good" : ""}">${ad.done ? "달성" : pct(ad.overall)}</b></div>
          <div class="pbar"><i class="${ad.done ? "done" : ""}" style="width:${Math.max(ad.overall, 1)}%"></i></div>
          <div class="muted" style="font-size:11.5px">${blockText(ad)}</div></div><span class="chev">›</span></a>`;

  const c = sel, ad = adOf(c), by = Object.fromEntries(ad.items.map(i => [i.key, i]));

      : i.eta ? `지금 하루 +${man(i.speed)}${per[i.key]} → ${span(i.eta)}` : (i.speed === null ? "속도는 며칠 쌓이면 계산돼요" : "최근 증가 없음");
    return `<div class="req ${alt ? "alt" : ""}"><div class="rl"><span>${i.label}</span><span><b>${man(i.cur)}</b> / ${man(i.goal)}${i.unit}</span></div>
      <div class="pbar"><i class="${done ? "done" : ""}" style="width:${Math.max(i.pct, i.cur > 0 ? 1 : 0)}%"></i></div>

  };
  const viewsLine = ad.views_left && by.watch.left ? `<div class="rv">👉 본편 조회수로 약 <b>${man(ad.views_left)}회</b> 더 (본편 평균 ${Math.round(ad.avg_long / 60)}분 × ${Math.round(c.money.retention * 100)}% 시청 기준)</div>` : "";
  const shortsLine = by.shorts90.left ? `<div class="rv">👉 90일 동안 하루 평균 <b>${man(Math.ceil(by.shorts90.goal / 90))}회</b>씩 나와야 해요</div>` : "";
  const cell = (i, unit) => i.left === 0 ? `<b class="good">달성</b>` : `<b>+${man(i.need_per_day)}${unit}</b>`;
  const now = i => i.speed === null ? `<span class="muted">-</span>` : `<span class="muted">+${man(i.key === "shorts90" ? Math.round(Math.max(0, i.speed)) : Math.max(0, i.speed))}</span>`;

  ${say("money", `<b>${esc(c.name)}</b>의 광고 수익 조건을 하나씩 봤어요. 흐린 쪽은 더 먼 길이라, 진한 쪽부터 채우면 돼요.`)}
  <div class="card money">
    <div class="mh">${avatar(c)}<div><div class="n">${esc(c.name)}</div><div class="muted" style="font-size:12px">${esc(c.handle)}</div></div>
      <span class="badge ${ad.done ? "ok" : ""}">${ad.done ? "조건 달성 · 신청하세요" : `광고 수익까지 ${pct(ad.overall)}`}</span></div>
    <div class="step">① 꼭 필요</div>${req(by.subs)}
    <div class="step">② 둘 중 하나만 (흐린 쪽이 더 먼 길)</div>
    ${req(by.watch, ad.best_path !== "watch", viewsLine)}<div class="or">또는</div>${req(by.shorts90, ad.best_path !== "shorts90", shortsLine)}
    ${ad.done ? "" : `<div class="warn">⏰ 2027년 2월 1일 전에 채우려면 <b>하루에</b> (D-${c.money.days_left})
      <div class="pace"><span></span><span class="muted">필요</span><span class="muted">지금</span>
        <span>구독자</span>${cell(by.subs, "명")}${now(by.subs)}
        <span>본편 시청</span>${cell(by.watch, "시간")}${now(by.watch)}
        <span>또는 쇼츠</span>${cell(by.shorts90, "회")}${now(by.shorts90)}</div></div>`}
  </div>
  <div class="note">본편 시청 시간은 공개 데이터로 알 수 없어서 본편 조회수 × 영상 길이 × ${Math.round(c.money.retention * 100)}%로 추정했어요. 정확한 값은 YouTube 스튜디오 → 수익 창출 탭에 있어요.</div>
  ${moneyGuide()}`;
}

/* ───────── 제작비 ───────── */

    </div>

      <div class="crow head"><span>채널</span><span>총 제작비</span><span>1편 평균</span><span class="hide-m">1,000회당</span><span></span></div>
      ${C.채널.map(c => `<a class="crow" href="#cost/${encodeURIComponent(c.name)}">
        <div class="who">${(D.channels.find(x => x.name === c.name) ? avatar(D.channels.find(x => x.name === c.name)) : '<span class="av"></span>')}
          <div style="min-width:0"><div class="n">${esc(c.name)}</div><div class="h">${c.편수}편${c.크레딧 ? ` · 크레딧 ${man(c.크레딧)}개` : ""}${c.요금모름 ? " · 일부 요금 모름" : ""}</div></div></div>

  const C = D.cadence || { rows: [], dates: [] }, ds = C.dates || [];

  const today = ds[27] || "", tmr = (() => { const d = new Date(today + "T12:00:00"); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); })();
  const hm = s => { const [d, t] = String(s).split(" "); return (d === today ? "오늘" : d === tmr ? "내일" : d.slice(5).replace("-", "/")) + " " + parseInt(t, 10) + "시"; };
  const next = r => !r.due || r.target < 2 ? "" : r.due < today ? ` · <span class="due">${r.late_at ? esc(hm(r.late_at)) + "까지 " : ""}올릴 차례</span>`
    : r.due === today ? ` · <span class="due">오늘 올릴 차례</span>` : ` · 다음 ${esc(r.due.slice(5).replace("-", "/"))}`;
  const st = r => r.n === 0 ? '<span class="st">공개 영상 기록 없음</span>'
    : r.late ? `<span class="st bad">⚠ ${Math.round(r.since)}일째 (평소 ${r.target}일마다)</span>`
    : `<span class="st">마지막 ${r.since < 1 ? Math.max(1, Math.round(r.since * 24)) + "시간" : Math.round(r.since) + "일"} 전${r.target ? ` · 평소 ${r.target}일마다` : ""}${next(r)}</span>`;
  const cell = (x, i) => { const [a, b] = x, c = a && b ? "b" : a ? "s" : b ? "l" : ""; return `<i class="${c}${i === 27 ? " today" : ""}" title="${esc((ds[i] || "").slice(5).replace("-", "/"))} 쇼츠 ${a} · 본편 ${b}"></i>`; };
  const late = (C.rows || []).filter(r => r.late);
  const lateTxt = late.length ? ` 지금 늦은 채널은 <b>${late.map(r => esc(r.name)).join(", ")}</b>${jo2(late[late.length - 1].name, "이에요", "예요")}.` : " 지금 늦은 채널은 없어요.";
  return `<h2 class="pt">📅 업로드 달력</h2>
  ${say("scheduler", `채널마다 평소 올리는 간격을 재서, 그보다 많이 늦어지면(평소의 1.5배를 넘기면) 알려 드려요. 텔레그램으로도 한 번 보내요. 칸 하나가 하루예요.${lateTxt}`)}
  <section class="card">${hd}${(C.rows || []).map(r => `<div class="crow2"><div class="ctop"><span><span class="dot" style="background:${color(r.name)}"></span> ${esc(r.name)}${r.set ? ` <span class="muted" style="font-size:11px">· 목표 ${r.target}일마다</span>` : ""}</span>${st(r)}</div>
    <div class="cells">${(r.cal || []).map(cell).join("")}</div></div>`).join("")}
    <div class="legend"><span><i style="background:var(--shorts)"></i>쇼츠</span><span><i style="background:var(--long)"></i>본편</span><span><i style="background:linear-gradient(135deg,var(--shorts) 50%,var(--long) 50%)"></i>둘 다</span><span><i style="background:var(--soft);box-shadow:0 0 0 1.5px var(--ink) inset"></i>오늘</span></div></section>
  <div class="note">평소 간격은 올린 날짜끼리 최근 10번 간격의 중앙값이에요. 채널마다 목표 간격을 정하고 싶으면 알려 주세요(예: '거인의무덤은 이틀에 한 편').</div>`;
}
function insEngage() {
  const rows = D.channels.map(c => {
    const views = c.shorts_views + c.long_views;
    const w = D.weekly.channels.find(x => x.name === c.name);
    return { c, like: views ? c.likes / views * 100 : null, comment: views ? c.comments / views * 100 : null, spk: w ? w.subs_per_1k : null };
  });
  const fans = D.videos.filter(v => v.views >= 30 && v.like_rate !== null).sort((a, b) => b.like_rate - a.like_rate).slice(0, 8);
  return `<h2 class="pt">❤️ 반응률</h2>
  ${say("reviewer", "조회수만 보면 놓치는 것 — <b>본 사람 중 몇 %가 좋아요·댓글을 눌렀는지</b>, <b>1,000회 볼 때 구독자가 몇 명 늘었는지</b>예요. 반응률이 높은 영상은 팬을 만드는 영상이라 비슷한 주제를 더 만들면 좋아요. (보통 좋아요율 2~5%면 괜찮은 편)")}
  <div class="card scroll"><table class="tbl">
    <tr><th>채널</th><th>좋아요율</th><th>댓글율</th><th>1,000회당 구독</th></tr>
    ${rows.map(r => `<tr><td><span class="dot" style="background:${color(r.c.name)}"></span> ${esc(r.c.name)}</td>
      <td><b>${r.like === null ? "-" : r.like.toFixed(1) + "%"}</b></td><td>${r.comment === null ? "-" : r.comment.toFixed(2) + "%"}</td>
      <td>${r.spk === null ? '<span class="muted">내일부터</span>' : r.spk + "명"}</td></tr>`).join("")}
  </table></div>
  <div class="sec">💖 팬을 만드는 영상 <span class="muted" style="font-size:12.5px;font-weight:500">좋아요율 순 · 조회수 30회 이상</span></div>
  <div class="card list">${fans.length ? fans.map(v => videoItem(v, v => `<b class="up">${v.like_rate.toFixed(1)}%</b><span class="muted">👍 ${man(v.likes)} · 💬 ${man(v.comments)}</span>`)).join("") : '<div class="empty">아직 없어요</div>'}</div>`;
}
function insTiming() {
  const T = D.timing;
  const bars = arr => {
    const max = Math.max(...arr.map(x => x.avg || 0), 1);
    const best = arr.filter(x => x.avg).sort((a, b) => b.avg - a.avg)[0];
    return arr.map(x => `<div class="hbar"><span>${x.label}</span><div class="bar"><i class="${best && x === best ? "best" : ""}" style="width:${(x.avg || 0) / max * 100}%"></i></div>
      <span>${x.avg === null ? "영상 없음" : man(Math.round(x.avg)) + "회 · " + x.n + "개"}</span></div>`).join("");
  };
  const best = [...T.slot, ...T.weekday].filter(x => x.avg && x.n >= 2).sort((a, b) => b.avg - a.avg)[0];
  return `<h2 class="pt">⏰ 업로드 시간</h2>
  ${say("scheduler", `어느 요일·시간대에 올린 영상이 잘 됐는지 비교해요. 막대 숫자는 그 시간에 올린 영상들의 <b>평균 하루 조회수</b>(24시간 기록이 3개 이상 쌓이면 24시간 조회수)예요. 지금은 영상 ${T.n}개 기준이라 <b>참고용</b>이고, 영상이 20개 넘게 쌓이면 믿을 만해져요.`)}
  ${best ? `<div class="card" style="margin-bottom:10px">지금까지는 <b class="up">${best.label}</b>에 올린 영상이 가장 잘 됐어요 <span class="muted">(영상 ${best.n}개 평균)</span></div>` : ""}
  <div class="grid2">
    <div class="card"><div class="hlh"><b>시간대별</b><span class="muted">한국 시간</span></div>${bars(T.slot)}</div>
    <div class="card"><div class="hlh"><b>요일별</b><span class="muted">한국 시간</span></div>${bars(T.weekday)}</div>
  </div>`;
}
function insBench() {
  const B = D.bench;
  const fors = ["all", ...new Set(B.channels.map(c => c.for).filter(Boolean))];
  const names = new Set(B.channels.filter(c => state.bfor === "all" || c.for === state.bfor).map(c => c.name));
  const vids = B.videos.filter(v => names.has(v.ch)).slice(0, 20);
  return `<h2 class="pt">🔭 벤치마크</h2>
  ${say("trend", "비슷한 주제의 <b>인기 채널</b>에서 최근 14일 안에 올라온 영상 중 <b>하루 조회수가 높은 순</b>이에요. 요즘 어떤 주제·제목이 먹히는지 아이디어를 얻는 용도예요. 6시간마다 새로 확인해요.")}
  <div class="chips" id="bfor" style="margin-bottom:12px">${fors.map(k => `<button class="chip ${state.bfor === k ? "on" : ""}" data-k="${esc(k)}">${k === "all" ? "전체" : esc(k) + " 참고"}</button>`).join("")}</div>
  <div class="card scroll" style="margin-bottom:10px"><table class="tbl">
    <tr><th>참고 채널</th><th>구독자</th><th>우리 채널</th></tr>
    ${B.channels.filter(c => names.has(c.name)).map(c => `<tr><td><a href="${esc(c.url)}" target="_blank" rel="noopener"><b>${esc(c.name)}</b> <span class="muted">↗</span></a></td><td>${man(c.subs)}</td><td class="muted">${esc(c.for)}</td></tr>`).join("")}
  </table></div>
  <div class="sec">🔥 요즘 뜨는 영상</div>
  <div class="card list">${vids.length ? vids.map(v => videoItem(v, v => `<b class="up">${man(v.per_day)}</b><span class="muted">회/일</span>`)).join("") : '<div class="empty">다음 수집 때 채워져요</div>'}</div>
  <div class="note">참고 채널을 바꾸거나 추가하고 싶으면 클로드에게 채널 주소를 알려주세요.${B.at ? ` · 마지막 확인 ${ago(B.at)}` : ""}</div>`;
}
function afterInsight(sub) {
  const rerender = () => { $("#app").innerHTML = pageInsight(sub); afterInsight(sub); };
  document.querySelectorAll("#flt [data-k]").forEach(b => b.onclick = () => { state.ech = b.dataset.k; remember(); rerender(); });
  document.querySelectorAll("#bfor [data-k]").forEach(b => b.onclick = () => { state.bfor = b.dataset.k; remember(); rerender(); });
}

/* ───────── 라우팅 ───────── */
function route() {
  if (!D) { $("#app").innerHTML = '<div class="empty">아직 수집 전이에요</div>'; return; }
  const [page, arg] = (location.hash.slice(1) || "summary").split("/");
  const a = arg ? decodeURIComponent(arg) : null;
  const cur = MENU.some(m => m[0] === page) ? page : (page === "team" ? "team" : "summary");
  const nav = short => MENU.map(([k, ic, l, s]) => `<a href="#${k}" class="${k === cur || (cur === "team" && k === "summary") ? "on" : ""}"><span class="ic">${ic}</span>${short && s ? s : l}</a>`).join("");
  $("#tabs").innerHTML = nav(false); $("#bottom").innerHTML = nav(true);
  mpStop();   // 다른 화면으로 가면 회의 재생·소리를 멈춘다
  charts.forEach(c => c.destroy()); charts = [];
  const pages = { team: [pageTeam, () => {}], summary: [pageSummary, afterSummary], channel: [() => pageChannel(a), () => afterChannel(a)], videos: [pageVideos, afterVideos],
    money: [() => pageMoney(a), () => {}], cost: [() => pageCost(a), () => {}], hunt: [() => pageHunt(), () => afterHunt()], topics: [() => pageTopics(a), () => afterTopics()], insight: [() => pageInsight(a), () => afterInsight(a)] };
  $("#app").innerHTML = pages[cur][0]();
  pages[cur][1]();
  window.scrollTo(0, 0);
}
if (D) $("#upd").innerHTML = `업데이트 ${D.updated.slice(5).replace("-", "/")}<br><span style="font-size:11px">10분마다 자동</span>`;
window.addEventListener("hashchange", route);
if (window.Chart || document.readyState === "complete") route(); else window.addEventListener("load", route);
</script>
