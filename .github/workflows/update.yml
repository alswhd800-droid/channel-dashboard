name: 채널 통계 수집

on:
  schedule:
    - cron: "3-59/10 * * * *"   # 10분마다 (깃허브 예약은 자주 밀리거나 빠져서, 아래 '이어 달리기'가 실제 주기를 맡음)
  workflow_dispatch:             # 깃허브에서 [Run workflow]로 바로 실행 · 이어 달리기

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 시작 시각 기록
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 이전 기록 가져오기 (gh-pages 브랜치)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q --depth=1 origin gh-pages
            rm -rf data && git archive FETCH_HEAD data | tar -x
          fi
      - name: 수집 + 알림 + 대시보드 생성
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collect.py
      - name: 떡상 후보 발굴 (하루 3번만 — API 할당량이 하루 10,000유닛이라 수집과 나눠 쓴다)
        if: always()
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          H=$(date -u +%H); M=$(date -u +%M)
          # UTC 21·05·12시 = 한국 06·14·21시, 각 시각의 첫 10분에만
          if [ "$M" -lt 10 ] && { [ "$H" = "21" ] || [ "$H" = "05" ] || [ "$H" = "12" ]; }; then
            python 발굴.py --budget 1000 || echo "발굴 실패(다음 차례에 다시 시도)"
            python collect.py --build          # 발굴 결과를 대시보드에 반영
          else
            echo "이번 차례는 건너뜀 (발굴은 한국시간 06·14·21시)"
          fi
      - name: 대시보드 올리기 (기록이 쌓여 저장소가 커지지 않게 gh-pages는 항상 커밋 1개로 덮어씀)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf site && mkdir site
          cp -R data site/data && cp docs/index.html site/index.html && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "통계 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: 페이지 다시 올리기 요청 (봇 푸시는 자동으로 안 올라가서 직접 요청)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "페이지 빌드 요청 실패(다음 실행 때 다시 시도)"
      - name: 이어 달리기 (시작 10분 뒤 다음 실행을 스스로 부름, 이미 대기 중인 실행이 있으면 생략)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rest=$(( 600 - ($(date +%s) - START) ))
          if [ "$rest" -gt 0 ]; then sleep "$rest"; fi
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" --workflow update.yml --limit 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "${waiting:-0}" -eq 0 ]; then
            gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main && echo "다음 실행 예약됨"
          else
            echo "이미 대기 중인 실행이 있어 생략"
          fi
