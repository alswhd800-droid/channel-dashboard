name: 채널 통계 수집

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분 (UTC 기준이지만 매시간이라 상관없음)
  workflow_dispatch:       # 깃허브에서 [Run workflow]로 바로 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 수집 + 대시보드 생성
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collect.py
      - name: 결과 저장
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "통계 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
