name: 채널 통계 수집

on:
  schedule:
    - cron: "3-59/10 * * * *"   # 10분마다 (3분, 13분, 23분 …)
  workflow_dispatch:             # 깃허브에서 [Run workflow]로 바로 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 이전 기록 가져오기 (gh-pages 브랜치)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q --depth=1 origin gh-pages
            rm -rf data && git archive FETCH_HEAD data | tar -x
          fi
      - name: 수집 + 알림 + 대시보드 생성
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collect.py
      - name: 대시보드 올리기 (기록이 쌓여 저장소가 커지지 않게 gh-pages는 항상 커밋 1개로 덮어씀)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf site && mkdir site
          cp -R data site/data && cp docs/index.html site/index.html && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "통계 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
