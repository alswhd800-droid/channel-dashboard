<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>채널 대시보드</title>
<meta name="description" content="유튜브·인스타 채널 성장과 시청자 분석">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 22V14M14 22V9M20 22V16M26 22V11' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 2026-10-22 전면 개편: 한눈에 · 채널(누가 보는지) · 콘텐츠 · 분석 · 소재 · 일정 · 발굴 · 수익 */
:root {
  color-scheme: light;
  --bg: #f5f5f3; --surface: #ffffff; --surface-2: #f2f1ee; --surface-3: #e9e8e4;
  --ink: #141416; --ink-2: #52514e; --muted: #898781; --line: #e6e5e0; --line-2: #d3d2cc;
  --accent: #2a78d6; --accent-soft: #e6f0fc; --up: #0a7d34; --down: #c93636; --warn: #a76a00; --warn-soft: #fff4dc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --yt: #ff0033; --shadow: 0 1px 2px rgba(20,20,22,.04), 0 1px 1px rgba(20,20,22,.03);
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e0e0f; --surface: #18181a; --surface-2: #202023; --surface-3: #2a2a2e;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e88; --line: #2a2a2d; --line-2: #3a3a3e;
    --accent: #3987e5; --accent-soft: #16273d; --up: #2fbf5b; --down: #ee6b6b; --warn: #f0b429; --warn-soft: #2e2510;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0e0f; --surface: #18181a; --surface-2: #202023; --surface-3: #2a2a2e;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e88; --line: #2a2a2d; --line-2: #3a3a3e;
  --accent: #3987e5; --accent-soft: #16273d; --up: #2fbf5b; --down: #ee6b6b; --warn: #f0b429; --warn-soft: #2e2510;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 "Pretendard Variable", Pretendard, -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif; letter-spacing: -0.005em; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
img { display: block; }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }

/* 왼쪽 메뉴 */
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 750; font-size: 16px; }
.brand svg { flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); font-weight: 560; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.side .foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.theme { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; width: max-content; }
.theme button { border: 0; background: none; padding: 4px 9px; font-size: 12px; color: var(--muted); }
.theme button.on { background: var(--surface-2); color: var(--ink); font-weight: 650; }

main { min-width: 0; padding: 28px 32px 64px; max-width: 1240px; width: 100%; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.ph h1 { margin: 0; font-size: 24px; font-weight: 760; letter-spacing: -0.02em; }
.ph .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
h2 { font-size: 16px; font-weight: 720; margin: 0; letter-spacing: -0.01em; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 28px 0 10px; }
.sec h2 { font-size: 16.5px; }
.sec .more { color: var(--muted); font-size: 13px; }
.sec .more:hover { color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card > h2 + .hint, .card .hint { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.auto { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }
.empty { color: var(--muted); text-align: center; padding: 26px 12px; font-size: 13.5px; }
.note { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.6; }
.warnbox { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
.num { font-variant-numeric: tabular-nums; }

/* 숫자 타일 */
.stat .k { color: var(--ink-2); font-size: 13px; font-weight: 560; display: flex; align-items: center; gap: 6px; }
.stat .v { font-size: 28px; font-weight: 760; letter-spacing: -0.025em; margin-top: 4px; line-height: 1.15; }
.stat .s { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.delta { font-weight: 650; font-size: 12.5px; }

/* 칩·세그먼트 */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 560; color: var(--ink-2); white-space: nowrap; }
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { color: var(--muted); font-weight: 500; font-size: 12px; }
.chip.on .n { color: inherit; opacity: .7; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.bar-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
select { font: inherit; font-size: 13px; padding: 6px 28px 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 650; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.yt { background: color-mix(in srgb, var(--yt) 12%, transparent); color: var(--yt); }
.pill.ig { background: color-mix(in srgb, #d6249f 12%, transparent); color: #c0268f; }
.pill.good { background: color-mix(in srgb, var(--up) 14%, transparent); color: var(--up); }
.pill.bad { background: color-mix(in srgb, var(--down) 13%, transparent); color: var(--down); }
.pill.blue { background: var(--accent-soft); color: var(--accent); }
.pill.sh { background: color-mix(in srgb, var(--s2) 14%, transparent); color: var(--s2); }
.pill.lf { background: color-mix(in srgb, var(--s7) 14%, transparent); color: var(--s7); }

/* 계정 카드 */
.acct { display: flex; flex-direction: column; gap: 10px; transition: border-color .15s; }
.acct:hover { border-color: var(--line-2); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--surface-3); object-fit: cover; }
.av.lg { width: 56px; height: 56px; }
.who .n { font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .h { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct .big { font-size: 24px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
.acct .big small { font-size: 13px; color: var(--muted); font-weight: 560; margin-left: 4px; }
.acct .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.acct .sp svg { width: 100%; height: 34px; }
.acct .cap { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.acct .ds { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.spark { display: block; overflow: visible; }

/* 목록 */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); min-width: 0; }
.item:first-child { border-top: 0; }
a.item:hover .t { color: var(--accent); }
.item .t { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item .m { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item .m .dot { margin-right: 5px; vertical-align: 1px; }
.item .m .pill { vertical-align: 1px; }
.item .r { margin-left: auto; text-align: right; flex: none; font-size: 13px; }
.item .r b { display: block; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.thumb { width: 96px; aspect-ratio: 16 / 9; border-radius: 8px; object-fit: cover; background: var(--surface-3); flex: none; }
.thumb.sq { width: 56px; aspect-ratio: 1; }
.ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--surface-2); font-size: 15px; }

/* 표 */
.tblwrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { text-align: right; padding: 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl td .tt2 { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; font-weight: 600; }
.tbl td small { display: block; color: var(--muted); font-size: 11.5px; }

/* 차트 */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .g { stroke: var(--line); stroke-width: 1; }
.chart .b { stroke: var(--line-2); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .hl { fill: var(--surface-2); }
.chart .xh { stroke: var(--line-2); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
#tt { position: fixed; z-index: 50; pointer-events: none; display: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,.14); max-width: 280px; }
#tt b { font-weight: 700; }
#tt .row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
#tt .row i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
#tt .row span:last-child { margin-left: auto; padding-left: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }

/* 가로 막대 */
.hb { display: grid; grid-template-columns: minmax(84px, 128px) minmax(0, 1fr) 62px; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.hb .hl { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .tr { height: 12px; background: var(--surface-2); border-radius: 4px; position: relative; display: flex; gap: 2px; overflow: hidden; }
.hb .tr i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .tr i + i { border-radius: 0 4px 4px 0; }
.hb .tr.split i:first-child { border-radius: 0; }
.hb .hv { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.share { display: flex; gap: 2px; height: 14px; border-radius: 5px; overflow: hidden; margin: 8px 0 6px; }
.share i { display: block; height: 100%; min-width: 3px; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.kv span { display: inline-flex; align-items: center; gap: 6px; }
.kv i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.kv b { color: var(--ink); font-variant-numeric: tabular-nums; }
.insight { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.insight div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; min-width: 150px; flex: 1; }
.insight div small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
.insight div b { font-size: 14.5px; }
.prog { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.prog i.done { background: var(--up); }

/* 채널 머리 */
.chead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.chead .n { font-size: 22px; font-weight: 760; letter-spacing: -0.02em; }
.chead .h { color: var(--muted); font-size: 13px; }
.chead .links { margin-left: auto; display: flex; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--line-2); }
.back { color: var(--muted); font-size: 13px; display: inline-flex; gap: 4px; margin-bottom: 10px; }
.back:hover { color: var(--accent); }
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.post { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.post .ph2 { aspect-ratio: 4 / 5; border-radius: 10px; background: var(--surface-3) center / cover no-repeat; position: relative; }
.post .ph2 .pill { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; }
.post .st { display: flex; flex-wrap: wrap; gap: 3px 10px; color: var(--ink-2); }
.post .st b { color: var(--ink); }
.post .cap { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 소재 */
.topic { border-top: 1px solid var(--line); padding: 16px 0; }
.topic:first-child { border-top: 0; padding-top: 4px; }
.topic .hd { display: flex; gap: 12px; align-items: flex-start; }
.score { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-weight: 780; font-size: 17px; flex: none; background: var(--surface-2); color: var(--ink-2); }
.score.hi { background: var(--accent-soft); color: var(--accent); }
.topic .nm { font-weight: 700; font-size: 15px; }
.topic .ttl { margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; }
.topic .ttl .tx { font-weight: 600; flex: 1; background: var(--surface-2); padding: 8px 10px; border-radius: 10px; font-size: 13.5px; }
.topic .ttl .tx .ko { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.topic .why { color: var(--ink-2); font-size: 13.5px; margin: 8px 0; }
.sbars { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.sbars div { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: center; }
.sbars i { grid-column: 1 / -1; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.sbars u { display: block; height: 100%; background: var(--accent); }
.dm { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.ed { margin-top: 8px; font-size: 13px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--ink); }
.ed b { color: var(--accent); }
.dm a { color: var(--accent); margin-left: 6px; }
details.memo { margin-top: 8px; font-size: 13px; }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 12.5px; }
details .dl { display: grid; gap: 8px; margin-top: 8px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
details .dl .k { font-size: 11.5px; color: var(--muted); font-weight: 650; }
details .dl ul { margin: 2px 0 0; padding-left: 18px; }
.ibtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 600; flex: none; }
.ibtn.ok { color: var(--up); border-color: var(--up); }
.ibtn.star.on { color: var(--warn); border-color: var(--warn); }

/* 일정 */
.strip { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
.strip i { height: 22px; border-radius: 5px; background: var(--surface-2); font-style: normal; font-size: 11px; display: grid; place-items: center; font-weight: 700; color: var(--ink-2); }
.strip i.pub { background: var(--c); color: #fff; }
.strip i.rsv { box-shadow: inset 0 0 0 2px var(--c); color: var(--ink); background: var(--surface); }
.strip i.plan { box-shadow: inset 0 0 0 1.5px var(--line-2); background: repeating-linear-gradient(45deg, var(--surface), var(--surface) 3px, var(--surface-2) 3px, var(--surface-2) 6px); }
.strip i.chk { background: var(--warn-soft); color: var(--warn); }
.strip i.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.striphd { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; font-size: 10.5px; color: var(--muted); text-align: center; margin-bottom: 4px; }
.striphd .today { color: var(--ink); font-weight: 700; }
.srow { padding: 12px 0; border-top: 1px solid var(--line); }
.srow:first-of-type { border-top: 0; }
.srow .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 650; font-size: 13.5px; margin-bottom: 4px; flex-wrap: wrap; }
.srow .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { font-size: 11.5px; color: var(--muted); text-align: center; padding: 4px 0; }
.cal button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 64px; padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.cal button.past { background: var(--surface-2); }
.cal button.today { border-color: var(--ink); }
.cal button.sel { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
.cal .dn { font-size: 12px; font-weight: 650; }
.cal .pips { display: flex; flex-wrap: wrap; gap: 3px; }

const niceStep = r => { if (r <= 0) return 1; const p = 10 ** Math.floor(Math.log10(r)), n = r / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };
function yScale(vals) {

  const t = []; for (let v = lo; v <= hi + st / 2; v += st) t.push(+v.toFixed(6));
  return { lo, hi, t };
}
function yScaleTight(vals) {   // 팔로워·구독자 누적선: 0부터 시작하면 변화가 안 보여서 범위만
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const st = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const t = []; for (let v = lo; v <= hi + st / 2; v += st) t.push(+v.toFixed(6));

function drawChart(el, c) {

  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 58))));
  for (let i = n - 1; i >= 0; i -= every) g += `<text class="ax" x="${xc(i)}" y="${H - 6}" text-anchor="middle">${esc(c.x[i])}</text>`;
  let body = "";
  if (bar) {
    const bw = Math.max(1.5, Math.min(26, step * 0.66)), r = Math.min(4, bw / 2.5);
    for (let i = 0; i < n; i++) {
      let pos = 0, neg = 0;
      const segs = c.series.map((s, k) => ({ v: s.data[i], k })).filter(x => x.v);
      const lastPos = segs.filter(x => x.v > 0).pop(), lastNeg = segs.filter(x => x.v < 0).pop();
      segs.forEach(({ v, k }) => {
        const col = c.series[k].color, x0 = xc(i) - bw / 2;
        if (v > 0) {
          const y1 = y(pos + v), y0 = y(pos); pos += v;
          const gap = pos - v > 0 ? 1.5 : 0, top = y1, bot = y0 - gap, rr = x => x === lastPos ? Math.min(r, (bot - top) / 1.5) : 0, rad = rr(segs.find(s => s.k === k));
          if (bot - top > 0.3) body += `<path d="M${x0},${bot}V${top + rad}Q${x0},${top} ${x0 + rad},${top}H${x0 + bw - rad}Q${x0 + bw},${top} ${x0 + bw},${top + rad}V${bot}Z" fill="${col}"/>`;
        } else {
          const y0 = y(neg), y1 = y(neg + v); neg += v;
          const gap = neg - v < 0 ? 1.5 : 0, top = y0 + gap, bot = y1, rad = (segs.find(s => s.k === k) === lastNeg) ? Math.min(r, (bot - top) / 1.5) : 0;
          if (bot - top > 0.3) body += `<path d="M${x0},${top}V${bot - rad}Q${x0},${bot} ${x0 + rad},${bot}H${x0 + bw - rad}Q${x0 + bw},${bot} ${x0 + bw},${bot - rad}V${top}Z" fill="${col}"/>`;
        }
      });
    }
  } else {
    c.series.forEach(s => {
      let d = "", pen = false, first = null, last = null;
      s.data.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += `${pen ? "L" : "M"}${xc(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; if (first === null) first = i; last = i; });
      if (s.area && first !== null) body += `<path d="${d}L${xc(last)},${y(Math.max(sc.lo, 0))}L${xc(first)},${y(Math.max(sc.lo, 0))}Z" fill="${s.color}" fill-opacity="0.1"/>`;
      body += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="4 4"' : ""}/>`;

  const svg = el.querySelector("svg"), hov = svg.querySelector(".hov"), hov2 = svg.querySelector(".hov2");
  const pick = e => { const p = svg.getBoundingClientRect(), x = (e.clientX - p.left) * (W / p.width) - L; return Math.max(0, Math.min(n - 1, bar ? Math.floor(x / step) : Math.round(x / (iw / Math.max(1, n - 1))))); };

    else {

      hov2.innerHTML = c.series.map(s => s.data[i] === null || s.data[i] === undefined ? "" : `<circle cx="${xc(i)}" cy="${y(s.data[i])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join("");

}

function spark(vals, { w = 132, h = 38, kind = "line", color = "var(--accent)" } = {}) {
  const v = vals.map(x => x === undefined ? null : x), nn = v.filter(x => x !== null);
  if (nn.length < 2) return `<svg class="spark" width="${w}" height="${h}"></svg>`;
  const lo = kind === "bar" ? 0 : Math.min(...nn), hi = Math.max(...nn), span = hi - lo || 1, n = v.length;
  if (kind === "bar") {

function timingCard(vids) {
  const base = vids.filter(v => v.views > 0 && v.age >= 1);
  if (base.length < 5) return '<div class="card empty">영상이 5개 넘게 쌓이면 요일별로 비교해 드려요</div>';
  const val = v => v.early && v.early["24"] ? v.early["24"].views : v.per_day;
  const rows = [...WDAY].map((w, k) => { const g = base.filter(v => (v.pub_wd + 1) % 7 === k); const vs = g.map(val).sort((a, b) => a - b); return { w, n: g.length, med: vs.length ? vs[Math.floor(vs.length / 2)] : null }; });
  const order = [1, 2, 3, 4, 5, 6, 0].map(k => rows[k]);
  return `<div class="card"><div class="hint" style="margin-bottom:8px">올린 뒤 24시간 조회수(없으면 하루 평균)의 중간값 · 영상 수가 적은 요일은 흐리게</div>
    ${chartBox({ type: "bar", x: order.map(r => r.w), xl: order.map(r => `${r.w}요일 · ${r.n}편`), series: [{ name: "중간값", data: order.map(r => r.med), color: "var(--s1)" }], h: 180 })}</div>`;
}

  let ig = IGOK.flatMap(a => (a.media || []).map(m => ({ ...m, user: a.user }))).filter(m => (S.vch === "all" || "@" + m.user === S.vch) && (Date.now() - Date.parse(m.t.replace(" ", "T") + ":00+09:00")) / 864e5 <= per);
  if (S.vplat === "ig" || (S.vch !== "all" && S.vch.startsWith("@"))) yt = [];

  + (yt.length ? `<div class="card">${videoTable(yt.slice(0, 120), { showCh: true })}${yt.length > 120 ? `<div class="note">상위 120개만 보여요 (전체 ${yt.length}개)</div>` : ""}</div>` : "")
  + (ig.length ? `${yt.length ? sec("인스타") : ""}<div class="card"><div class="posts">${ig.slice(0, 60).map(m => `<a class="post" href="${esc(m.url)}" target="_blank" rel="noopener"><div class="ph2" style="background-image:url('${esc(m.thumb || "")}')"><span class="pill">${esc(m.type)}</span></div>
      <div class="st"><span>조회 <b>${man(m.views)}</b></span>${m.gain ? `<span class="up">어제 +${man(m.gain)}</span>` : ""}<span>도달 <b>${man(m.reach)}</b></span><span>♥ <b>${man(m.likes)}</b></span><span>저장 <b>${man(m.saves)}</b></span></div><div class="cap">@${esc(m.user)} · ${md(m.t)}</div></a>`).join("")}</div></div>` : "")

    return `<div style="padding:12px 0;border-top:1px solid var(--line);${dim ? "opacity:.55" : ""}"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13.5px"><span>${esc(i.label)}</span><span><b>${man(i.cur)}</b> / ${man(i.goal)}${i.unit}</span></div>
      <div class="prog"><i class="${done ? "done" : ""}" style="width:${Math.max(i.pct, i.cur > 0 ? 1 : 0)}%"></i></div><div class="muted" style="font-size:12.5px">${done ? "✅ 달성" : `${pctf(i.pct)} · ${man(i.left)}${i.unit} 남음 · ${eta}`}</div></div>`; };
  return `<a class="back" href="#money/ads">← 전체 채널</a><div class="card"><div class="chead" style="margin-bottom:6px">${avatar(c.thumb)}<div><div class="n" style="font-size:17px">${esc(c.name)}</div></div><span class="pill ${ad.done ? "good" : "blue"}" style="margin-left:auto">${ad.done ? "조건 달성 · 신청하세요" : `광고 수익까지 ${pctf(ad.overall)}`}</span></div>
    <div class="hint" style="margin:8px 0 2px;font-weight:650">① 꼭 필요</div>${req(by.subs)}
    <div class="hint" style="margin:14px 0 2px;font-weight:650">② 둘 중 하나만 (흐린 쪽이 더 먼 길)</div>${req(by.watch, ad.best_path !== "watch")}${req(by.shorts90, ad.best_path !== "shorts90")}
    ${ad.views_left && by.watch.left ? `<div class="note">👉 본편 조회수로 약 <b>${man(ad.views_left)}회</b> 더 (본편 평균 ${Math.round(ad.avg_long / 60)}분 × ${Math.round(c.money.retention * 100)}% 시청 기준)</div>` : ""}</div>
  <div class="note">본편 시청 시간은 공개 데이터로 알 수 없어 본편 조회수 × 영상 길이 × ${Math.round(c.money.retention * 100)}%로 추정했어요. 정확한 값은 유튜브 스튜디오 → 수익 창출 탭에 있어요.</div>`;
}
function moneyRev() {
  const rows = CH.map(c => ({ c, A: aud(c.name) })).filter(x => x.A && x.A.revenue && x.A.revenue.length);
  const has = rows.filter(x => sum(x.A.revenue.map(r => r[1])) > 0);
  if (!rows.length) return '<div class="card empty">수익 읽기 권한으로 연결된 채널이 아직 없어요.<br>파트너 채널(거대한비밀)을 다시 연결하면 날짜별 예상 수익이 나와요.</div>';
  return (has.length ? "" : `<div class="warnbox">연결된 채널(${rows.map(x => esc(x.c.name)).join(", ")})의 최근 90일 예상 수익이 0원이에요 — 보기 페이지 광고 단계 전이면 그대로 0이에요.</div>`)
  + rows.map(({ c, A }) => { const rv = A.revenue.slice(-90);
    return `<div class="card" style="margin-bottom:14px"><div class="card-h"><div><h2>${esc(c.name)}</h2><div class="hint">최근 28일 ${won(sum(rv.slice(-28).map(r => r[1])))} · 90일 ${won(sum(rv.map(r => r[1])))}</div></div></div>
      ${chartBox({ type: "bar", x: rv.map(r => md(r[0])), xl: rv.map(r => `${md(r[0])}(${wday(r[0])})`), series: [{ name: "예상 수익", data: rv.map(r => r[1]), color: "var(--s3)" }], h: 200, fmt: v => man(v) + "원" })}</div>`; }).join("");
}
function moneyCost(name) {
  const C = D.costs;
  if (!C) return '<div class="card empty">아직 제작비 자료가 없어요</div>';
  const sel = name && C.채널.find(c => c.name === name);
  if (!sel) return `<div class="grid g4">${stat("지금까지 쓴 돈", won(C.합계krw), `영상 ${C.편수}편`)}${stat("1편 평균", won(C.편수 ? Math.round(C.합계krw / C.편수) : 0))}${stat("그림", man(sum(C.채널.map(c => c.그림 + c.사진 + c.기타이미지))) + "장")}${stat("음성", man(sum(C.채널.map(c => c.글자))) + "자")}</div>
    <div class="card" style="margin-top:14px"><div class="tblwrap"><table class="tbl"><thead><tr><th>채널</th><th>총 제작비</th><th>1편 평균</th><th class="hide-m" data-tip="그 채널에 들어간 돈 ÷ 지금까지 조회수 × 1,000">1천 회당</th></tr></thead><tbody>
    ${C.채널.map(c => `<tr class="click" data-go="#money/cost/${encodeURIComponent(c.name)}"><td><div class="who"><span class="dot" style="background:${colorOf(c.name)}"></span><div><div class="n">${esc(c.name)}</div><div class="h">${c.편수}편${c.요금모름 ? " · 일부 요금 모름" : ""}</div></div></div></td><td><b>${won(c.합계krw)}</b></td><td>${won(Math.round(c.합계krw / Math.max(1, c.편수)))}</td><td class="hide-m">${c.천회당krw === null || c.천회당krw === undefined ? "-" : won(c.천회당krw)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="note">단가는 맥의 공통/요금표.json 기준(그림 1장·음성 1글자) · 1달러 = ${man(C.환율.USD_KRW)}원 · 음성 재생성분과 요금을 모르는 도구는 빠져 실제보다 적게 나올 수 있어요 · 집계 ${esc(C.집계일)}</div>`;
  const c = sel, eps = [...c.편].sort((a, b) => (b.완성일 || "").localeCompare(a.완성일 || ""));
  return `<a class="back" href="#money/cost">← 전체 채널</a><div class="grid g4">${stat("총 제작비", won(c.합계krw), `${c.편수}편`)}${stat("1편 평균", won(Math.round(c.합계krw / Math.max(1, c.편수))))}${stat("1천 회당", c.천회당krw === null || c.천회당krw === undefined ? "-" : won(c.천회당krw), `조회 ${man(c.조회수)}`)}${stat("쓴 재료", man(c.그림 + c.사진 + c.기타이미지) + "장", `음성 ${man(c.글자)}자`)}</div>
  <div class="card" style="margin-top:14px"><div class="tblwrap"><table class="tbl"><thead><tr><th>편</th><th>완성일</th><th>그림</th><th>음성</th><th>제작비</th></tr></thead><tbody>
  ${eps.map(e => `<tr><td><span class="tt2">${esc(e.편)}</span></td><td>${e.완성일 || '<span class="muted">미완성</span>'}</td><td>${man(e.그림.장면 + e.그림.썸네일 + e.그림.사진 + e.그림.기타)}장</td><td>${man(e.글자)}자</td><td><b>${won(Math.round(e.합계usd * C.환율.USD_KRW))}</b></td></tr>`).join("")}</tbody></table></div></div>`;
}

/* ───────── 라우팅 ───────── */
function render() {
  CHARTS = []; hideTT();
  const h = decodeURIComponent(location.hash.slice(1) || "home"), [p, a, b] = h.split("/");
  const alias = { summary: "home", channel: "ch", insight: "analysis", cost: "money" };
  const page = alias[p] || p;
  const navKey = { ch: "channels", ig: "channels" }[page] || page;
  side(MENU.some(m => m[0] === navKey) ? navKey : "home");
  const html = page === "channels" ? pageChannels() : page === "ch" ? pageChannel(a) : page === "ig" ? pageIG(a) : page === "videos" ? pageVideos()
    : page === "analysis" ? pageAnalysis(p === "insight" ? ({ efficiency: "eff" }[a] || a) : a) : page === "topics" ? pageTopics(a) : page === "schedule" ? pageSchedule() : page === "hunt" ? pageHunt()
    : page === "money" ? (p === "cost" ? pageMoney("cost", a) : MTAB.some(x => x[0] === a) ? pageMoney(a, b) : pageMoney("ads", a)) : pageHome();
  $("#main").innerHTML = html;
  document.title = (page === "ch" ? a + " · " : page === "ig" ? "@" + a + " · " : "") + "채널 대시보드";
  mountCharts();
  ["grow", "gper", "igrow", "chv", "vplat", "vtype", "vper", "tf", "tsort", "htype", "hsort", "hkind", "csort", "atype", "stype"].forEach(k => bindSeg(k));
  const vch = $("#vch"); if (vch) vch.onchange = () => { S.vch = vch.value; remember(); render(); };
  const vs = $("#vsort"); if (vs) vs.onchange = () => { S.vsort = vs.value; remember(); render(); };
  $$("tr[data-go]").forEach(r => r.onclick = () => { location.hash = r.dataset.go; });
  $$("tr[data-href]").forEach(r => r.onclick = e => { if (!e.target.closest("a")) open(r.dataset.href, "_blank", "noopener"); });
  $$("[data-copy]").forEach(btn => btn.onclick = async () => {
    try { await navigator.clipboard.writeText(btn.dataset.copy); } catch (e) { const ta = document.createElement("textarea"); ta.value = btn.dataset.copy; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    btn.textContent = "복사됨 ✓"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("ok"); }, 1500);
  });
  if (page === "topics") afterTopics();
  if (page === "schedule") afterSchedule();
}
let lastRoute = "";
addEventListener("hashchange", () => { const r = location.hash.split("/")[0]; render(); if (r !== lastRoute) scrollTo(0, 0); lastRoute = r; });
applyTheme();
if (!D) document.getElementById("main").innerHTML = '<div class="empty">아직 수집된 데이터가 없어요</div>';
else render();
// 10분마다 새 숫자가 올라온다 — 다른 탭에 있다가 돌아왔을 때 10분 넘게 지났으면 새로고침
const loadedAt = Date.now();
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - loadedAt > 10 * 60e3) location.reload(); });
</script>
